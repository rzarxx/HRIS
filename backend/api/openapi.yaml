    patch:
      tags: [Pengumuman]
      summary: Ubah pengumuman
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
