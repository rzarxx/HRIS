# Tempel ke konfigurasi situs API di aaPanel, di dalam blok server { }.
# X-Real-IP ditimpa di sini sehingga nilai kiriman klien tidak terpakai.
client_max_body_size 6m;

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Endpoint pemeriksaan tidak perlu terbuka ke internet.
location = /readyz { return 404; }
