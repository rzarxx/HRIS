      summary: Status wajah sendiri
      description: "Permission `face:enroll`. Template wajah tidak pernah dikirim ke klien."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/FaceStatus" }
  /v1/face/enroll:
    post:
      tags: [Wajah]
      summary: Daftarkan wajah (F7)
      description: "Permission `face:enroll`. Butuh perangkat approved, challenge `face_enroll`, persetujuan biometrik, liveness, dan lokasi di dalam geofence kantor atau izin jarak jauh satu kali dari SDM. Server menghitung wajah dari setiap selfie menggunakan SFace; selfie yang tidak saling mirip ditolak. Template lama dinonaktifkan. Verifikasi token Play diperlukan jika dikonfigurasi; tanpa verifier atau bypass development pendaftaran ditolak (D36)."
      parameters:
        - { name: X-Device-Id, in: header, required: true, description: "ID perangkat dari hasil registrasi", schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload, samples]
              properties:
                payload: { type: string, description: "JSON `FaceEnrollInput`" }
                samples:
                  type: array
                  minItems: 3
                  maxItems: 5
                  description: "3 sampai 5 selfie JPEG berbeda, masing-masing maksimal 1 MB, berurutan sesuai `sample_sha256`"
                  items: { type: string, format: binary }
            encoding:
              payload: { contentType: application/json }
              samples: { contentType: image/jpeg }
      responses:
        "201":
          description: Wajah terdaftar
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/FaceStatus" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
