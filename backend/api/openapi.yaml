        footer_template: { type: string, description: "Teks yang diatur; {tahun} diganti tahun berjalan (WIB)" }
        is_default: { type: boolean, description: True bila super admin belum mengubah footer }
        updated_at: { type: string, format: date-time, nullable: true }
    AppVersion:
      type: object
      required: [latest_code, latest_name, min_code, store_url, notes, updated_at]
      properties:
        latest_code: { type: integer, description: "versionCode terbaru; 0 bila belum diatur" }
        latest_name: { type: string, description: "Nama versi terbaru, mis. 0.14.0; kosong bila belum diatur" }
        min_code: { type: integer, description: "versionCode minimum yang masih dilayani; 0 berarti semua versi" }
        store_url: { type: string, description: "Tautan pembaruan; bawaan halaman Play Store" }
        notes: { type: string, description: "Catatan rilis singkat, teks murni, boleh beberapa baris" }
        updated_at: { type: string, format: date-time, nullable: true }
    AppVersionInput:
      type: object
      required: [latest_code, latest_name, min_code]
      properties:
        latest_code: { type: integer, minimum: 0, maximum: 2100000000, description: "Harus sama dengan versionCode dari latest_name" }
        latest_name: { type: string, description: "Bentuk x.y.z; wajib bila latest_code lebih dari 0" }
        min_code: { type: integer, minimum: 0, description: "Tidak boleh melebihi latest_code" }
        store_url: { type: string, description: "https://; kosong memakai halaman Play Store" }
        notes: { type: string, maxLength: 500 }
    FooterInput:
      type: object
      properties:
        footer_template: { type: string, maxLength: 200, nullable: true, description: "Null atau kosong mengembalikan teks bawaan" }
    MyAnnouncement:
      type: object
      description: Pengumuman yang sedang tayang untuk Pejuang yang masuk, beserta status bacanya
      required: [id, title, body, type, starts_at, ends_at, min_read_seconds, opened_at, read_at, read_wait_seconds, attachments]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
