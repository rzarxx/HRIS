          items: { $ref: "#/components/schemas/AttendanceReportLeaveType" }
        absent: { type: integer }
        review: { type: integer, description: "Presensi yang menunggu keputusan Review Presensi, belum dihitung hadir" }
        late_minutes: { type: integer }
        worked_minutes: { type: integer, description: "Total menit kerja dari presensi yang sudah pulang" }
        missed_clock_out:
          type: integer
          description: "Hari dengan presensi masuk tanpa presensi pulang yang batasnya (cutoff 04.00 esok hari, atau akhir shift malam + 4 jam) sudah lewat. Alpha hasil Review Presensi tidak dihitung."
    AttendanceReportLeaveType:
      type: object
      required: [leave_type_id, code, name, quota_kind, paid, days]
      properties:
        leave_type_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        quota_kind: { type: string, enum: [statutory, custom, none] }
        paid: { type: boolean }
        days: { type: integer }
    PayrollPreviewRow:
      type: object
      required:
        [employee_id, nip, full_name, division, subdivision, base_salary, absent, late, absent_deduction, late_deduction, net]
      properties:
        employee_id: { type: string, format: uuid }
        nip: { type: string }
        full_name: { type: string }
        division: { type: string }
        subdivision: { type: string }
        base_salary: { $ref: "#/components/schemas/Money" }
        absent: { type: integer }
        late: { type: integer }
        absent_deduction: { $ref: "#/components/schemas/Money" }
        late_deduction: { $ref: "#/components/schemas/Money" }
        net: { $ref: "#/components/schemas/Money" }
    AttendanceChallengeInput:
      type: object
      required: [purpose]
      properties:
        purpose: { type: string, enum: [clock_in, clock_out, face_enroll] }
    AttendanceChallenge:
      type: object
      required: [challenge_id, nonce, expires_at, liveness_action]
      properties:
        challenge_id: { type: string, format: uuid }
        nonce: { type: string }
        expires_at: { type: string, format: date-time }
        liveness_action: { type: string, enum: [turn_left, turn_right], description: "Gerakan liveness yang diminta, dipilih acak oleh server (D42). Hanya toleh kepala, karena server membuktikannya dari foto gerakan (D50)." }
    ClockInput:
      type: object
      required: [challenge_id, latitude, longitude, accuracy_m, captured_at]
      description: "Payload presensi. Skor wajah adalah kemiripan cosine SFace (D43): di bawah 0.46 ditolak `FACE_MISMATCH`, 0.46 sampai 0.50 diterima dengan sinyal `face_borderline` (+20). Selfie yang pernah dikirim ditolak `ATTENDANCE_BLOCKED`."
      properties:
        challenge_id: { type: string, format: uuid }
        latitude: { type: number, minimum: -90, maximum: 90, example: -6.2001 }
        longitude: { type: number, minimum: -180, maximum: 180, example: 106.8166 }
        accuracy_m: { type: number, minimum: 0, example: 12.5 }
        captured_at: { type: string, format: date-time }
        integrity_token: { type: string, maxLength: 32768, description: "Token Play Integrity untuk presensi; wajib ketika perangkat memakai jalur Play." }
        device_proof: { type: string, maxLength: 512, description: "Tanda tangan ECDSA P-256 (base64 ASN.1 DER) atas `HRIS-DEVICE-PROOF-V1\\n<request_hash>`." }
        attestation_chain:
          type: array
          maxItems: 8
          description: "Opsional: rantai sertifikat Android Key Attestation (base64 DER) untuk tantangan request_hash."
          items: { type: string, maxLength: 8192 }
        signals: { $ref: "#/components/schemas/AttendanceSignals" }
        selfie_sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: "SHA-256 berkas selfie; wajib bila selfie dikirim" }
        liveness_passed: { type: boolean }
        liveness_action: { type: string, description: "Gerakan yang dilakukan, harus sama dengan liveness_action challenge" }
        gesture_sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: "SHA-256 berkas foto gerakan; wajib bila selfie dikirim (D50)" }
    FaceEnrollInput:
      type: object
      required: [challenge_id, sample_sha256, gesture_sha256, liveness_passed, liveness_action, consent_version, latitude, longitude, accuracy_m]
      properties:
        challenge_id: { type: string, format: uuid, description: "Challenge `face_enroll`" }
        captured_at: { type: string, format: date-time, description: "Waktu foto untuk mengikat token integritas; diperlukan saat verifikasi perangkat aktif." }
        integrity_token: { type: string, maxLength: 32768, description: "Token Play Integrity untuk pendaftaran wajah." }
        device_proof: { type: string, maxLength: 512, description: "Tanda tangan ECDSA P-256 (base64 ASN.1 DER) atas `HRIS-DEVICE-PROOF-V1\\n<request_hash>`." }
        attestation_chain:
          type: array
          maxItems: 8
          description: "Opsional: rantai sertifikat Android Key Attestation (base64 DER) untuk tantangan request_hash."
          items: { type: string, maxLength: 8192 }
        sample_sha256:
          type: array
          minItems: 3
          maxItems: 5
          description: SHA-256 setiap berkas sampel, berurutan
          items: { type: string, pattern: '^[0-9a-f]{64}$' }
        liveness_passed: { type: boolean }
        liveness_action: { type: string, description: "Harus sama dengan liveness_action challenge" }
        gesture_sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: "SHA-256 berkas foto gerakan (D50)" }
        consent_version: { type: string, maxLength: 32, description: Versi teks persetujuan biometrik yang diterima }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy_m: { type: number, minimum: 0 }
        signals: { $ref: "#/components/schemas/AttendanceSignals" }
    RemoteFacePermission:
      type: object
      required: [expires_at, reason]
      properties:
        expires_at: { type: string, format: date-time }
        reason: { type: string }
    FaceStatus:
      type: object
      required: [enrolled, model_version, enrolled_at]
      properties:
        enrolled: { type: boolean }
