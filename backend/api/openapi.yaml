      properties:
        employee_id: { type: string, format: uuid }
        employee_name: { type: string }
        nip: { type: string }
        subdivision_name: { type: string }
        division_id: { type: string, format: uuid }
        division_name: { type: string }
        shift_name: { type: string, nullable: true }
        scheduled: { type: boolean, description: "false bila hari libur, di luar hari kerja shift, atau shift belum ditentukan" }
        status: { type: string, nullable: true, enum: [present, late, absent, leave, review], description: Kosong berarti belum ada presensi }
        clock_in_at: { type: string, format: date-time, nullable: true }
        clock_out_at: { type: string, format: date-time, nullable: true }
        late_minutes: { type: integer }
        work_mode: { type: string, nullable: true, enum: [onsite, wfa, field] }
        location_name: { type: string, nullable: true }
        in_latitude: { type: number, nullable: true }
        in_longitude: { type: number, nullable: true }
        out_latitude: { type: number, nullable: true }
        out_longitude: { type: number, nullable: true }
    AttendanceReviewItem:
      type: object
      description: Skor dan alasan risiko hanya untuk peninjau (D8).
      required: [id, employee_id, employee_name, nip, subdivision_name, division_name, work_date, clock_in_at, clock_out_at, late_minutes, work_mode, flexible_hours, location_name, in_latitude, in_longitude, out_latitude, out_longitude, in_accuracy_m, risk_score, risk_flags]
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        employee_name: { type: string }
        nip: { type: string }
        subdivision_name: { type: string }
        division_name: { type: string }
        work_date: { type: string, format: date }
        clock_in_at: { type: string, format: date-time, nullable: true }
        clock_out_at: { type: string, format: date-time, nullable: true }
        late_minutes: { type: integer }
        work_mode: { type: string, enum: [onsite, wfa, field] }
        flexible_hours: { type: boolean }
        location_name: { type: string, nullable: true }
        in_latitude: { type: number, nullable: true }
        in_longitude: { type: number, nullable: true }
        out_latitude: { type: number, nullable: true }
        out_longitude: { type: number, nullable: true }
        in_accuracy_m: { type: number, nullable: true }
        risk_score: { type: integer }
        risk_flags:
          type: array
          items: { type: string }
    AttendanceResolveInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [present, late, absent] }
        note: { type: string, maxLength: 500, description: Wajib minimal 3 karakter bila absent }
    AttendanceResolved:
      type: object
      required: [id, work_date, status, late_minutes, review_note, reviewed_at]
      properties:
        id: { type: string, format: uuid }
        work_date: { type: string, format: date }
        status: { type: string, enum: [present, late, absent] }
        late_minutes: { type: integer }
        review_note: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time }
    BulkWorkArrangementInput:
      allOf:
        - $ref: "#/components/schemas/WorkArrangementInput"
        - type: object
          properties:
            division_id: { type: string, format: uuid }
            subdivision_id: { type: string, format: uuid }
    BulkWorkArrangementResult:
      type: object
      required: [created, skipped]
      properties:
        created: { type: integer }
        skipped:
          type: array
          items:
            type: object
            required: [employee_id, employee_name, reason]
            properties:
              employee_id: { type: string, format: uuid }
              employee_name: { type: string }
              reason: { type: string, enum: [self, protected, overlap] }
    AttendanceAttempt:
      type: object
      required: [id, employee_id, employee_name, nip, subdivision_name, division_name, purpose, outcome, reason_code, risk_score, risk_flags, latitude, longitude, created_at]
      properties:
        id: { type: integer, format: int64 }
        employee_id: { type: string, format: uuid }
        employee_name: { type: string }
        nip: { type: string }
        subdivision_name: { type: string }
        division_name: { type: string }
        purpose: { type: string, enum: [clock_in, clock_out, face_enroll] }
        outcome: { type: string, enum: [accepted, review, rejected] }
        reason_code: { type: string, description: "Kode internal MASTER.md §6.3" }
        risk_score: { type: integer }
        risk_flags: { type: array, items: { type: string } }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        created_at: { type: string, format: date-time }
    WorkArrangementInput:
      type: object
      required: [mode, starts_on, reason]
      properties:
        mode: { type: string, enum: [wfa, hybrid] }
        flexible_hours: { type: boolean, default: false }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true, description: Kosong berarti tanpa akhir }
        weekdays:
          type: array
          description: 1=Senin sampai 7=Ahad. Kosong berarti setiap hari.
          items: { type: integer, minimum: 1, maximum: 7 }
        reason: { type: string, maxLength: 500 }
    WorkArrangement:
      type: object
      required: [id, employee_id, mode, flexible_hours, starts_on, ends_on, weekdays, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        mode: { type: string, enum: [wfa, hybrid] }
        flexible_hours: { type: boolean }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true }
        weekdays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    RequestKind:
      type: string
      enum: [leave, cash_advance, transfer]
    RequestStatus:
      type: string
      enum: [pending, approved, rejected, cancelled]
    ApprovalStepStatus:
      type: string
      enum: [waiting, pending, approved, rejected, skipped]
    ApprovalStep:
      type: object
      required: [step_order, approver_role, approver_name, status, note, acted_at]
      properties:
        step_order: { type: integer }
        approver_role: { type: string, enum: [subdiv, kadiv, sdm] }
        approver_name: { type: string, nullable: true, description: Kosong untuk pool sdm }
        status: { $ref: "#/components/schemas/ApprovalStepStatus" }
        note: { type: string, nullable: true, description: Catatan approver, atau alasan langkah dilewati }
        acted_at: { type: string, format: date-time, nullable: true }
    ApprovalItem:
      type: object
      required: [id, request_type, request_id, step_order, approver_role, status, requester, summary, note, acted_at, created_at]
      properties:
        id: { type: string, format: uuid }
        request_type: { $ref: "#/components/schemas/RequestKind" }
        request_id: { type: string, format: uuid }
        step_order: { type: integer }
        approver_role: { type: string, enum: [subdiv, kadiv, sdm] }
        status: { $ref: "#/components/schemas/ApprovalStepStatus" }
        requester:
          type: object
          required: [employee_id, full_name, subdivision_name]
          properties:
            employee_id: { type: string, format: uuid }
            full_name: { type: string }
            subdivision_name: { type: string }
        summary:
          type: object
          description: Ringkasan sesuai jenis. Cuti berisi leave_type, start_date, end_date, days, reason.
          properties:
            leave_type: { type: string }
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
            days: { type: integer }
            reason: { type: string }
        note: { type: string, nullable: true }
        acted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        steps:
          type: array
          description: Hanya pada detail
          items: { $ref: "#/components/schemas/ApprovalStep" }
    ApprovalDecision:
      type: object
      properties:
        note: { type: string, maxLength: 500, nullable: true, description: Wajib minimal 3 karakter untuk reject }
    ApprovalFlow:
      type: object
      required: [request_type, steps]
      properties:
        request_type: { $ref: "#/components/schemas/RequestKind" }
        steps:
          type: array
          items:
            type: object
            required: [step_order, approver_role]
            properties:
              step_order: { type: integer }
              approver_role: { type: string, enum: [subdiv, kadiv, sdm] }
    ApprovalFlowInput:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required: [approver_role]
            properties:
              approver_role: { type: string, enum: [subdiv, kadiv, sdm] }
    LeaveBalance:
      type: object
      required: [year, entitled_days, used_days, remaining_days, eligible_from]
      properties:
        year: { type: integer }
        entitled_days: { type: integer }
        used_days: { type: integer }
        remaining_days: { type: integer }
        eligible_from: { type: string, format: date, nullable: true, description: Untuk statutory, 12 bulan setelah join_date }
    LeaveType:
      type: object
      required: [id, code, name, paid, quota_kind, annual_quota_days, is_active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        paid: { type: boolean }
        quota_kind: { type: string, enum: [statutory, custom, none] }
        annual_quota_days: { type: integer, nullable: true }
        is_active: { type: boolean }
        balance: { $ref: "#/components/schemas/LeaveBalance" }
    LeaveTypeInput:
      type: object
      required: [name, quota_kind]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{1,31}$', description: Wajib saat membuat, diabaikan saat mengubah }
        name: { type: string, maxLength: 60 }
        paid: { type: boolean, default: true }
        quota_kind: { type: string, enum: [statutory, custom, none] }
        annual_quota_days: { type: integer, minimum: 1, maximum: 366, nullable: true, description: Wajib untuk custom }
        is_active: { type: boolean, default: true }
    LeaveInput:
      type: object
      required: [leave_type_id, start_date, end_date, reason]
      properties:
        leave_type_id: { type: string, format: uuid }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        reason: { type: string, minLength: 3, maxLength: 500 }
    LeaveRequest:
      type: object
      required: [id, employee_id, leave_type, start_date, end_date, days, reason, status, created_at, decided_at, approvals]
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        employee_name: { type: string, description: Ada pada detail dan daftar admin }
        subdivision_name: { type: string, description: Ada pada detail dan daftar admin }
        leave_type:
          type: object
          required: [id, code, name]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        days: { type: integer, description: Hari kerja dalam rentang }
        reason: { type: string }
        status: { $ref: "#/components/schemas/RequestStatus" }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
        approvals:
          type: array
          items: { $ref: "#/components/schemas/ApprovalStep" }
    EmployeeLocationsInput:
      type: object
      required: [location_ids]
      properties:
        location_ids:
          type: array
          items: { type: string, format: uuid }
    ShiftPatch:
      type: object
      description: Pada PATCH, field yang tidak dikirim tetap nilai lamanya.
      properties:
        name: { type: string, maxLength: 80 }
        start_time: { type: string, pattern: '^\d{2}:\d{2}$', description: "Jam WIB", example: "08:00" }
        end_time: { type: string, pattern: '^\d{2}:\d{2}$', description: "Lebih awal dari start_time berarti lewat tengah malam", example: "17:00" }
        late_tolerance_minutes: { type: integer, minimum: 0, maximum: 240 }
        work_days:
          type: array
          minItems: 1
          description: 1=Senin sampai 7=Ahad
          items: { type: integer, minimum: 1, maximum: 7 }
        kind: { $ref: "#/components/schemas/ShiftKind" }
    ShiftKind:
      type: string
      enum: [regular, half_day]
      description: "Reguler, atau setengah hari yang dihitung 0,5 hari kerja di rekap (D61). Bawaan regular."
    EmployeeShift:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/ShiftKind" }
    ShiftInput:
      allOf:
        - $ref: "#/components/schemas/ShiftPatch"
        - type: object
          required: [name, start_time, end_time, late_tolerance_minutes, work_days]
    Shift:
      type: object
      required: [id, name, start_time, end_time, late_tolerance_minutes, work_days, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        start_time: { type: string }
        end_time: { type: string }
        late_tolerance_minutes: { type: integer }
        work_days:
          type: array
          items: { type: integer }
        kind: { $ref: "#/components/schemas/ShiftKind" }
    Holiday:
      type: object
      required: [date, name]
      properties:
        date: { type: string, format: date }
        name: { type: string, maxLength: 120 }
    PayrollRules:
      type: object
      required: [version, work_days_divisor, late_penalty, note]
      properties:
        version: { type: string, example: preview-v0 }
        work_days_divisor: { type: integer }
        late_penalty: { $ref: "#/components/schemas/Money" }
        note: { type: string }
