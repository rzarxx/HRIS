        expires_in: { type: integer, description: Detik sampai access token kedaluwarsa }
        device_id: { type: string, format: uuid, description: Kirim di header X-Device-Id pada route presensi }
        device_status: { type: string, enum: [pending, approved] }
    Me:
      type: object
      required:
        [user_id, employee_id, role, full_name, nip, email, phone, position, subdivision, division, permissions, must_change_password, mfa_enabled, mfa_required, face_enrolled, has_photo, photo_updated_at, pending_email]
