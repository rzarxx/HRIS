    get:
      tags: [Pengumuman]
      summary: Detail pengumuman
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Announcement" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Pengumuman]
      summary: Ubah pengumuman
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Announcement" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Pengumuman]
      summary: Hapus pengumuman
      responses:
        "204": { description: Dihapus }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Kartu ringkasan
      description: "Permission `dashboard:read`."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DashboardSummary" }
  /v1/admin/dashboard/org-chart:
    get:
      tags: [Dashboard]
      summary: Data grafik struktur organisasi
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OrgChart" }

  /v1/admin/reports/attendance:
    get:
      tags: [Laporan]
      summary: Rekap presensi bulanan
      description: "Permission `attendance:report`, dibatasi scope. Filter mode hanya menghitung catatan absen masuk dengan mode tersebut; cuti dan alpha tidak disertakan."
      parameters:
        - $ref: "#/components/parameters/Year"
        - $ref: "#/components/parameters/Month"
        - { name: division_id, in: query, schema: { type: string, format: uuid } }
        - { name: work_mode, in: query, schema: { type: string, enum: [onsite, wfa, field] }, description: Hanya hitung presensi dengan mode ini }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AttendanceReportRow" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
  /v1/admin/reports/payroll-preview:
    get:
      tags: [Laporan]
      summary: Pratinjau upah berdasarkan presensi
      description: "Permission `attendance:report` dan `payroll:manage`. Rumus sementara, ada di `meta.rules`."
      parameters:
        - $ref: "#/components/parameters/Year"
        - $ref: "#/components/parameters/Month"
        - { name: division_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PayrollPreviewRow" }
                  meta:
                    type: object
                    required: [rules]
                    properties:
                      rules: { $ref: "#/components/schemas/PayrollRules" }
        "400": { $ref: "#/components/responses/ValidationFailed" }

components:
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Nilai cookie `hris_csrf`. Wajib untuk semua method selain GET, HEAD, dan OPTIONS.
    cookieAuth:
      type: apiKey
      in: cookie
      name: hris_at
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token aplikasi mobile, terikat perangkat lewat klaim `did`. Tidak butuh CSRF. Bila header `Authorization` dikirim, cookie diabaikan.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Year:
      name: year
      in: query
      required: true
      schema: { type: integer, minimum: 2000, maximum: 2100 }
    Month:
      name: month
      in: query
      required: true
      schema: { type: integer, minimum: 1, maximum: 12 }
  responses:
    Error:
      description: Error dengan kode dari registry MASTER.md §7.4
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationFailed:
      description: Input tidak valid, rincian per field ada di `details.fields`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: VALIDATION_FAILED
              message: Periksa kembali isian form.
              details: { fields: { full_name: Nama lengkap wajib diisi. } }
              request_id: 01J0000000000000000000000
  schemas:
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: Rupiah, string desimal 2 digit
      example: "5000000.00"
    Role:
      type: string
      enum: [pejuang, subdiv, kadiv, sdm, superadmin]
    ErrorCode:
      type: string
      description: Registry MASTER.md §7.4
      enum:
        - VALIDATION_FAILED
        - AUTH_INVALID_CREDENTIALS
        - AUTH_TOKEN_INVALID
        - AUTH_MFA_REQUIRED
        - AUTH_MFA_INVALID
        - FORBIDDEN_ROLE
        - CSRF_INVALID
        - PASSWORD_CHANGE_REQUIRED
        - MFA_SETUP_REQUIRED
        - DEVICE_NOT_REGISTERED
        - DEVICE_PENDING_APPROVAL
        - DEVICE_REVOKED
        - APPROVAL_NOT_YOUR_TURN
        - APPROVAL_SELF_FORBIDDEN
        - MAKER_CHECKER_VIOLATION
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - ALREADY_CLOCKED_IN
        - ALREADY_CLOCKED_OUT
        - SHIFT_NOT_ASSIGNED
        - NOT_CLOCKED_IN
        - REQUEST_NOT_PENDING
        - PERIOD_LOCKED
        - DUPLICATE_REQUEST
        - CONFLICT_DUPLICATE
        - CONFLICT_HAS_DEPENDENTS
        - CONFLICT_SELF_ACTION
        - MFA_ALREADY_ENABLED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - GEOFENCE_OUT
        - FACE_NOT_ENROLLED
        - FACE_MISMATCH
        - LIVENESS_FAILED
        - FACE_NOT_DETECTED
        - FACE_SERVICE_UNAVAILABLE
        - CHALLENGE_EXPIRED
        - ATTENDANCE_BLOCKED
        - ACTIVATION_INVALID
        - ACTIVATION_USED
        - ACTIVATION_EXPIRED
        - AUTH_ACCOUNT_LOCKED
        - APP_UPDATE_REQUIRED
        - RATE_LIMITED
        - API_ACCESS_DENIED
        - INTERNAL_ERROR
    Permission:
      type: string
      description: Matriks MASTER.md §3.2
      enum:
        - "profile:read"
        - "profile:update"
        - "org:read"
        - "org:write"
        - "employee:read"
        - "employee:write"
        - "user:manage"
        - user:reset
        - "device:register"
        - "device:review"
        - "face:enroll"
        - "face:reset"
        - "attendance:clock"
        - "attendance:read"
        - "attendance:review"
        - "attendance:report"
        - "location:manage"
        - "shift:manage"
        - "leave:create"
        - "cash_advance:create"
        - "transfer:create"
        - "leave:read"
        - "cash_advance:read"
        - "transfer:read"
        - "approval:act"
        - "payslip:read"
        - "payroll:manage"
        - "payroll:finalize"
        - "warning:read"
        - "warning:manage"
        - "announcement:read"
        - "announcement:manage"
        - "dashboard:read"
        - "approval_flow:manage"
        - "audit:read"
    EmployeeStatus:
      type: string
      enum: [active, inactive]
    AnnouncementType:
      type: string
      enum: [popup, banner]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, request_id]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, example: Data tidak ditemukan. }
            details: { type: object }
            request_id: { type: string }
    PageMeta:
      type: object
      required: [page, per_page, total]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    Ref:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    MobileLoginRequest:
      type: object
      required: [email, password, device]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        mfa_code: { type: string, description: Wajib bila akun memakai MFA }
        device: { $ref: "#/components/schemas/DeviceRegisterInput" }
    MobileRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    MobileTokens:
      type: object
      required: [access_token, refresh_token, expires_in, device_id, device_status]
      properties:
        access_token: { type: string, description: JWT 15 menit. Simpan di memori saja. }
        refresh_token: { type: string, description: Simpan di Android Keystore. }
        expires_in: { type: integer, description: Detik sampai access token kedaluwarsa }
        device_id: { type: string, format: uuid, description: Kirim di header X-Device-Id pada route presensi }
        device_status: { type: string, enum: [pending, approved] }
    Me:
      type: object
      required:
        [user_id, employee_id, role, full_name, nip, email, position, subdivision, division, permissions, must_change_password, mfa_enabled, face_enrolled]
      properties:
        user_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        full_name: { type: string }
        nip: { type: string }
        email: { type: string }
        position: { type: string, nullable: true }
        subdivision: { $ref: "#/components/schemas/Ref" }
        division: { $ref: "#/components/schemas/Ref" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        must_change_password: { type: boolean }
        mfa_enabled: { type: boolean }
        device_status:
          type: string
          nullable: true
          enum: [pending, approved, revoked, null]
          description: Status perangkat sesi aplikasi. Null untuk sesi web.
        face_enrolled: { type: boolean, description: "Wajah sudah terdaftar. Bila false, aplikasi membuka alur daftar wajah (F7)." }
    DivisionInput:
      allOf:
        - $ref: "#/components/schemas/DivisionPatch"
        - type: object
          required: [code, name]
    DivisionPatch:
      type: object
      description: Pada PATCH, field yang tidak dikirim tetap nilai lamanya.
      properties:
        code: { type: string, maxLength: 10, pattern: '^[A-Za-z0-9-]+$' }
        name: { type: string, maxLength: 80 }
        head_employee_id: { type: string, format: uuid, nullable: true }
    Division:
      type: object
      required: [id, code, name, head_employee_id, head_name, subdivision_count, employee_count, created_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        head_employee_id: { type: string, format: uuid, nullable: true }
        head_name: { type: string, nullable: true }
        subdivision_count: { type: integer }
        employee_count: { type: integer }
        created_at: { type: string, format: date-time }
    SubdivisionInput:
      allOf:
        - $ref: "#/components/schemas/SubdivisionPatch"
        - type: object
          required: [division_id, code, name]
    SubdivisionPatch:
      type: object
      description: Pada PATCH, field yang tidak dikirim tetap nilai lamanya.
      properties:
        division_id: { type: string, format: uuid }
        code: { type: string, maxLength: 12, pattern: '^[A-Za-z0-9-]+$' }
        name: { type: string, maxLength: 80 }
        head_employee_id: { type: string, format: uuid, nullable: true }
    Subdivision:
      type: object
      required: [id, division_id, division_name, code, name, head_employee_id, head_name, employee_count, created_at]
      properties:
        id: { type: string, format: uuid }
        division_id: { type: string, format: uuid }
        division_name: { type: string }
        code: { type: string }
        name: { type: string }
        head_employee_id: { type: string, format: uuid, nullable: true }
        head_name: { type: string, nullable: true }
        employee_count: { type: integer }
        created_at: { type: string, format: date-time }
    EmployeeInput:
      allOf:
        - $ref: "#/components/schemas/EmployeePatch"
        - type: object
          required: [full_name, email, subdivision_id]
          description: "`base_salary` wajib untuk SDM. Super admin tidak boleh mengirimnya; gaji dimulai dari 0 dan diisi SDM."
    EmployeePatch:
      type: object
      description: Pada PATCH, field yang tidak dikirim tetap nilai lamanya.
      properties:
        nip: { type: string, nullable: true, description: Kosong = dibuat otomatis }
        full_name: { type: string, minLength: 3, maxLength: 100 }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        subdivision_id: { type: string, format: uuid }
        position: { type: string, nullable: true }
        join_date: { type: string, format: date, nullable: true }
        base_salary: { $ref: "#/components/schemas/Money" }
        status: { $ref: "#/components/schemas/EmployeeStatus" }
        default_shift_id: { type: string, format: uuid, nullable: true, description: "Shift Pejuang. null = belum ditentukan" }
    Employee:
      type: object
      required:
        [id, nip, full_name, email, phone, subdivision_id, subdivision_name, division_id, division_name, position, join_date, status, default_shift_id, default_shift_name, face_enrolled]
      properties:
        id: { type: string, format: uuid }
        nip: { type: string }
        full_name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        subdivision_id: { type: string, format: uuid }
        subdivision_name: { type: string }
        division_id: { type: string, format: uuid }
        division_name: { type: string }
        position: { type: string, nullable: true }
        join_date: { type: string, format: date, nullable: true }
        status: { $ref: "#/components/schemas/EmployeeStatus" }
        default_shift_id: { type: string, format: uuid, nullable: true }
        default_shift_name: { type: string, nullable: true }
        face_enrolled: { type: boolean, description: Pejuang punya template wajah aktif }
        base_salary:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Hanya untuk sdm dan pemilik data
        account:
          allOf: [{ $ref: "#/components/schemas/EmployeeAccount" }]
          description: Hanya untuk pemegang user:manage. Tidak ada bila Pejuang belum punya akun.
    EmployeeAccount:
      type: object
      required: [user_id, role, is_active, is_locked, mfa_enabled]
      properties:
        user_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        is_active: { type: boolean, description: false = belum aktivasi atau dinonaktifkan }
        is_locked: { type: boolean }
        mfa_enabled: { type: boolean }
    EmployeeCreated:
      allOf:
        - $ref: "#/components/schemas/Employee"
        - type: object
          required: [activation]
          properties:
            activation: { $ref: "#/components/schemas/Activation" }
    Activation:
      type: object
      required: [token, expires_at]
      description: Hanya tampil sekali; server menyimpan hash-nya saja.
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
    MfaVerifyRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token: { type: string }
        code: { type: string, description: Kode TOTP 6 digit atau kode pemulihan }
    ActivateRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 10, maxLength: 256 }
    ActivationCheckRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    ActivationCheck:
      type: object
      required: [expires_at]
      properties:
        expires_at: { type: string, format: date-time }
    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 10, maxLength: 256 }
    Session:
      type: object
      required: [id, client, ip, user_agent, created_at, last_used_at, is_current]
      properties:
        id: { type: string, format: uuid }
        client: { type: string, enum: [web, mobile] }
        ip: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        is_current: { type: boolean }
    MfaSetup:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret: { type: string, description: Base32 }
        otpauth_url: { type: string }
    MfaEnableRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    MfaEnabled:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: Hanya tampil sekali
          items: { type: string }
    AnnouncementInput:
      allOf:
        - $ref: "#/components/schemas/AnnouncementPatch"
        - type: object
          required: [title, body, type, starts_at]
    AnnouncementPatch:
      type: object
      description: Pada PATCH, field yang tidak dikirim tetap nilai lamanya.
      properties:
        title: { type: string, maxLength: 120 }
        body: { type: string, maxLength: 2000, description: Teks murni }
        type: { $ref: "#/components/schemas/AnnouncementType" }
        image_upload_id: { type: string, format: uuid, nullable: true }
        division_id: { type: string, format: uuid, nullable: true, description: null = semua divisi }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean, default: true }
    Announcement:
      type: object
      required:
        [id, title, body, type, image_upload_id, division_id, division_name, starts_at, ends_at, is_active, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        type: { $ref: "#/components/schemas/AnnouncementType" }
        image_upload_id: { type: string, format: uuid, nullable: true }
        division_id: { type: string, format: uuid, nullable: true }
        division_name: { type: string, nullable: true }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    DashboardSummary:
      type: object
      required: [employee_count, division_count, subdivision_count, present_today, late_today, work_date]
      properties:
        employee_count: { type: integer }
        division_count: { type: integer }
        subdivision_count: { type: integer }
        present_today: { type: integer }
        late_today: { type: integer }
        work_date: { type: string, format: date }
    OrgChart:
      type: object
      required: [employees_per_subdivision, subdivisions_per_division]
      properties:
        employees_per_subdivision:
          type: array
          items:
            type: object
            required: [division, subdivision, employee_count]
            properties:
              division: { type: string }
              subdivision: { type: string }
              employee_count: { type: integer }
        subdivisions_per_division:
          type: array
          items:
            type: object
            required: [division, subdivision_count]
            properties:
              division: { type: string }
              subdivision_count: { type: integer }
    AttendanceReportRow:
      type: object
      required: [employee_id, nip, full_name, division, subdivision, work_days, present, late, leave, absent, late_minutes]
      properties:
        employee_id: { type: string, format: uuid }
        nip: { type: string }
        full_name: { type: string }
        division: { type: string }
        subdivision: { type: string }
        work_days: { type: integer }
        present: { type: integer, description: Hadir termasuk telat }
        late: { type: integer }
        leave: { type: integer }
        absent: { type: integer }
        late_minutes: { type: integer }
    PayrollPreviewRow:
      type: object
      required:
        [employee_id, nip, full_name, division, subdivision, base_salary, absent, late, absent_deduction, late_deduction, net]
      properties:
        employee_id: { type: string, format: uuid }
        nip: { type: string }
        full_name: { type: string }
        division: { type: string }
        subdivision: { type: string }
        base_salary: { $ref: "#/components/schemas/Money" }
        absent: { type: integer }
        late: { type: integer }
        absent_deduction: { $ref: "#/components/schemas/Money" }
        late_deduction: { $ref: "#/components/schemas/Money" }
        net: { $ref: "#/components/schemas/Money" }
    AttendanceChallengeInput:
      type: object
      required: [purpose]
      properties:
        purpose: { type: string, enum: [clock_in, clock_out, face_enroll] }
    AttendanceChallenge:
      type: object
      required: [challenge_id, nonce, expires_at, liveness_action]
      properties:
        challenge_id: { type: string, format: uuid }
        nonce: { type: string }
        expires_at: { type: string, format: date-time }
        liveness_action: { type: string, enum: [blink, turn_left, turn_right, smile], description: "Gerakan liveness yang diminta, dipilih acak oleh server (D42)" }
    ClockInput:
      type: object
      required: [challenge_id, latitude, longitude, accuracy_m, captured_at]
      description: "Payload absen. Skor wajah adalah kemiripan cosine SFace (D43): di bawah 0.46 ditolak `FACE_MISMATCH`, 0.46 sampai 0.50 diterima dengan sinyal `face_borderline` (+20). Selfie yang pernah dikirim ditolak `ATTENDANCE_BLOCKED`. Token Play saat ini hanya dapat diuji di development."
      properties:
        challenge_id: { type: string, format: uuid }
        latitude: { type: number, minimum: -90, maximum: 90, example: -6.2001 }
        longitude: { type: number, minimum: -180, maximum: 180, example: 106.8166 }
        accuracy_m: { type: number, minimum: 0, example: 12.5 }
        captured_at: { type: string, format: date-time }
        integrity_token: { type: string, maxLength: 32768, description: "Token Play Integrity untuk presensi; wajib ketika jalur Play dikonfigurasi." }
        signals: { $ref: "#/components/schemas/AttendanceSignals" }
        selfie_sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: "SHA-256 berkas selfie; wajib bila selfie dikirim" }
        liveness_passed: { type: boolean }
        liveness_action: { type: string, description: "Gerakan yang dilakukan, harus sama dengan liveness_action challenge" }
    FaceEnrollInput:
      type: object
      required: [challenge_id, sample_sha256, liveness_passed, liveness_action, consent_version, latitude, longitude, accuracy_m]
      properties:
        challenge_id: { type: string, format: uuid, description: "Challenge `face_enroll`" }
        captured_at: { type: string, format: date-time, description: "Waktu foto untuk mengikat token integritas; diperlukan saat verifikasi perangkat aktif." }
        integrity_token: { type: string, maxLength: 32768, description: "Token Play Integrity untuk pendaftaran wajah." }
        sample_sha256:
          type: array
          minItems: 3
          maxItems: 5
          description: SHA-256 setiap berkas sampel, berurutan
          items: { type: string, pattern: '^[0-9a-f]{64}$' }
        liveness_passed: { type: boolean }
        liveness_action: { type: string, description: "Harus sama dengan liveness_action challenge" }
        consent_version: { type: string, maxLength: 32, description: Versi teks persetujuan biometrik yang diterima }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy_m: { type: number, minimum: 0 }
        signals: { $ref: "#/components/schemas/AttendanceSignals" }
    RemoteFacePermission:
      type: object
      required: [expires_at, reason]
      properties:
        expires_at: { type: string, format: date-time }
        reason: { type: string }
    FaceStatus:
      type: object
      required: [enrolled, model_version, enrolled_at]
      properties:
        enrolled: { type: boolean }
        model_version: { type: string, nullable: true }
        enrolled_at: { type: string, format: date-time, nullable: true }
    ConsentInput:
      type: object
      required: [type, version]
      properties:
        type: { type: string, enum: [biometric_face, location] }
        version: { type: string, maxLength: 32 }
    AttendanceSignals:
      type: object
      description: "Laporan dari HP. Sifatnya saran, tetapi laporan buruk tetap ditolak."
      properties:
        is_mock_location: { type: boolean }
        fake_gps_app_detected: { type: boolean }
        root_detected: { type: boolean }
        emulator_detected: { type: boolean }
        app_version: { type: string }
    ClockInResult:
      type: object
      required: [attendance_id, work_date, status, clock_in_at, late_minutes, work_mode, office_location, requires_review]
      properties:
        attendance_id: { type: string, format: uuid }
        work_date: { type: string, format: date }
        status: { type: string, enum: [present, late, review] }
        clock_in_at: { type: string, format: date-time }
        late_minutes: { type: integer }
        work_mode: { type: string, enum: [onsite, wfa, field], description: Ditentukan server dari izin kerja dan lokasi }
        office_location:
          type: object
          nullable: true
          description: Kosong saat `wfa` dan `field`
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        requires_review: { type: boolean }
    ClockOutResult:
      type: object
      required: [attendance_id, work_date, clock_out_at, worked_minutes, requires_review]
      properties:
        attendance_id: { type: string, format: uuid }
        work_date: { type: string, format: date }
        clock_out_at: { type: string, format: date-time }
        worked_minutes: { type: integer }
        requires_review: { type: boolean }
    AttendanceRecord:
      type: object
      required: [id, work_date, status, clock_in_at, clock_out_at, late_minutes, worked_minutes, work_mode, location_name]
      properties:
        id: { type: string, format: uuid }
        work_date: { type: string, format: date }
        status: { type: string, enum: [present, late, absent, leave, review] }
        clock_in_at: { type: string, format: date-time, nullable: true }
        clock_out_at: { type: string, format: date-time, nullable: true }
        late_minutes: { type: integer }
        worked_minutes: { type: integer, nullable: true, description: "Kosong bila belum atau lupa absen pulang" }
        work_mode: { type: string, enum: [onsite, wfa, field] }
        location_name: { type: string, nullable: true }
    DeviceStatus:
      type: string
      enum: [pending, approved, revoked]
    DeviceRegisterInput:
      type: object
      required: [device_hash]
      properties:
        device_hash: { type: string, pattern: '^[a-f0-9]{64}$', description: "SHA-256 dari ID instalasi acak, bukan IMEI" }
        model: { type: string, nullable: true, maxLength: 100 }
        os_version: { type: string, nullable: true, maxLength: 50 }
        fcm_token: { type: string, nullable: true, maxLength: 4096 }
    Device:
      type: object
      description: Hash dan token notifikasi tidak pernah dikembalikan.
      required: [id, model, os_version, status, created_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        model: { type: string, nullable: true }
        os_version: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/DeviceStatus" }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }
    AdminDevice:
      allOf:
        - $ref: "#/components/schemas/Device"
        - type: object
          required: [employee_id, employee_name, nip, subdivision_name, division_name, approved_at, approved_by_name, revoked_at, revoked_reason, owner_is_superadmin]
          properties:
            employee_id: { type: string, format: uuid }
            employee_name: { type: string }
            nip: { type: string }
            subdivision_name: { type: string }
            division_name: { type: string }
            approved_at: { type: string, format: date-time, nullable: true }
            approved_by_name: { type: string, nullable: true }
            revoked_at: { type: string, format: date-time, nullable: true }
            revoked_reason: { type: string, nullable: true, description: "admin_revoked, replaced, atau offboarded" }
            owner_is_superadmin: { type: boolean, description: Pemiliknya super admin; hanya super admin yang bisa mencabutnya }
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90, example: -6.2001 }
        longitude: { type: number, minimum: -180, maximum: 180, example: 106.8166 }
    OfficeLocationPatch:
      type: object
      description: Pada PATCH, field yang tidak dikirim tetap nilai lamanya.
      properties:
        name: { type: string, maxLength: 120 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        radius_m: { type: integer, minimum: 10, maximum: 5000 }
        polygon:
          type: array
          nullable: true
          minItems: 3
          maxItems: 100
          description: Bila diisi, poligon dipakai sebagai pengganti radius
          items: { $ref: "#/components/schemas/GeoPoint" }
        is_active: { type: boolean }
    OfficeLocationInput:
      allOf:
        - $ref: "#/components/schemas/OfficeLocationPatch"
        - type: object
          required: [name, latitude, longitude, radius_m]
    OfficeLocation:
      type: object
      required: [id, name, latitude, longitude, radius_m, polygon, is_active, employee_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        radius_m: { type: integer }
        polygon:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/GeoPoint" }
        is_active: { type: boolean }
        employee_count: { type: integer }
    AttendanceMonitorItem:
      type: object
      required: [employee_id, employee_name, nip, subdivision_name, division_id, division_name, shift_name, scheduled, status, clock_in_at, clock_out_at, late_minutes, work_mode, location_name, in_latitude, in_longitude, out_latitude, out_longitude]
      properties:
        employee_id: { type: string, format: uuid }
        employee_name: { type: string }
        nip: { type: string }
        subdivision_name: { type: string }
        division_id: { type: string, format: uuid }
        division_name: { type: string }
        shift_name: { type: string, nullable: true }
        scheduled: { type: boolean, description: "false bila hari libur, di luar hari kerja shift, atau shift belum ditentukan" }
        status: { type: string, nullable: true, enum: [present, late, absent, leave, review], description: Kosong berarti belum ada absen }
        clock_in_at: { type: string, format: date-time, nullable: true }
        clock_out_at: { type: string, format: date-time, nullable: true }
        late_minutes: { type: integer }
        work_mode: { type: string, nullable: true, enum: [onsite, wfa, field] }
        location_name: { type: string, nullable: true }
        in_latitude: { type: number, nullable: true }
        in_longitude: { type: number, nullable: true }
        out_latitude: { type: number, nullable: true }
        out_longitude: { type: number, nullable: true }
    AttendanceReviewItem:
      type: object
      description: Skor dan alasan risiko hanya untuk peninjau (D8).
      required: [id, employee_id, employee_name, nip, subdivision_name, division_name, work_date, clock_in_at, clock_out_at, late_minutes, work_mode, flexible_hours, location_name, in_latitude, in_longitude, out_latitude, out_longitude, in_accuracy_m, risk_score, risk_flags]
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        employee_name: { type: string }
        nip: { type: string }
        subdivision_name: { type: string }
        division_name: { type: string }
        work_date: { type: string, format: date }
        clock_in_at: { type: string, format: date-time, nullable: true }
        clock_out_at: { type: string, format: date-time, nullable: true }
        late_minutes: { type: integer }
        work_mode: { type: string, enum: [onsite, wfa, field] }
        flexible_hours: { type: boolean }
        location_name: { type: string, nullable: true }
        in_latitude: { type: number, nullable: true }
        in_longitude: { type: number, nullable: true }
        out_latitude: { type: number, nullable: true }
        out_longitude: { type: number, nullable: true }
        in_accuracy_m: { type: number, nullable: true }
        risk_score: { type: integer }
        risk_flags:
          type: array
          items: { type: string }
    AttendanceResolveInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [present, late, absent] }
        note: { type: string, maxLength: 500, description: Wajib minimal 3 karakter bila absent }
    AttendanceResolved:
      type: object
      required: [id, work_date, status, late_minutes, review_note, reviewed_at]
      properties:
        id: { type: string, format: uuid }
        work_date: { type: string, format: date }
        status: { type: string, enum: [present, late, absent] }
        late_minutes: { type: integer }
        review_note: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time }
    BulkWorkArrangementInput:
      allOf:
        - $ref: "#/components/schemas/WorkArrangementInput"
        - type: object
          properties:
            division_id: { type: string, format: uuid }
            subdivision_id: { type: string, format: uuid }
    BulkWorkArrangementResult:
      type: object
      required: [created, skipped]
      properties:
        created: { type: integer }
        skipped:
          type: array
          items:
            type: object
            required: [employee_id, employee_name, reason]
            properties:
              employee_id: { type: string, format: uuid }
              employee_name: { type: string }
              reason: { type: string, enum: [self, protected, overlap] }
    AttendanceAttempt:
      type: object
      required: [id, employee_id, employee_name, nip, subdivision_name, division_name, purpose, outcome, reason_code, risk_score, risk_flags, latitude, longitude, created_at]
      properties:
        id: { type: integer, format: int64 }
        employee_id: { type: string, format: uuid }
        employee_name: { type: string }
        nip: { type: string }
        subdivision_name: { type: string }
        division_name: { type: string }
        purpose: { type: string, enum: [clock_in, clock_out, face_enroll] }
        outcome: { type: string, enum: [accepted, review, rejected] }
        reason_code: { type: string, description: "Kode internal MASTER.md §6.3" }
        risk_score: { type: integer }
        risk_flags: { type: array, items: { type: string } }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        created_at: { type: string, format: date-time }
    WorkArrangementInput:
      type: object
      required: [mode, starts_on, reason]
      properties:
        mode: { type: string, enum: [wfa, hybrid] }
        flexible_hours: { type: boolean, default: false }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true, description: Kosong berarti tanpa akhir }
        weekdays:
          type: array
          description: 1=Senin sampai 7=Ahad. Kosong berarti setiap hari.
          items: { type: integer, minimum: 1, maximum: 7 }
        reason: { type: string, maxLength: 500 }
    WorkArrangement:
      type: object
      required: [id, employee_id, mode, flexible_hours, starts_on, ends_on, weekdays, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        mode: { type: string, enum: [wfa, hybrid] }
        flexible_hours: { type: boolean }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true }
        weekdays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    EmployeeLocationsInput:
      type: object
      required: [location_ids]
      properties:
        location_ids:
          type: array
          items: { type: string, format: uuid }
    ShiftPatch:
      type: object
      description: Pada PATCH, field yang tidak dikirim tetap nilai lamanya.
      properties:
        name: { type: string, maxLength: 80 }
        start_time: { type: string, pattern: '^\d{2}:\d{2}$', description: "Jam WIB", example: "08:00" }
        end_time: { type: string, pattern: '^\d{2}:\d{2}$', description: "Lebih awal dari start_time berarti lewat tengah malam", example: "17:00" }
        late_tolerance_minutes: { type: integer, minimum: 0, maximum: 240 }
        work_days:
          type: array
          minItems: 1
          description: 1=Senin sampai 7=Ahad
          items: { type: integer, minimum: 1, maximum: 7 }
    ShiftInput:
      allOf:
        - $ref: "#/components/schemas/ShiftPatch"
        - type: object
          required: [name, start_time, end_time, late_tolerance_minutes, work_days]
    Shift:
      type: object
      required: [id, name, start_time, end_time, late_tolerance_minutes, work_days]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        start_time: { type: string }
        end_time: { type: string }
        late_tolerance_minutes: { type: integer }
        work_days:
          type: array
          items: { type: integer }
    Holiday:
      type: object
      required: [date, name]
      properties:
        date: { type: string, format: date }
        name: { type: string, maxLength: 120 }
    PayrollRules:
      type: object
      required: [version, work_days_divisor, late_penalty, note]
      properties:
        version: { type: string, example: preview-v0 }
        work_days_divisor: { type: integer }
        late_penalty: { $ref: "#/components/schemas/Money" }
        note: { type: string }
