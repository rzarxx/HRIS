name: Android release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Validasi tag dan buat versionCode
        id: version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Tag harus berupa versi stabil vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if (( major > 2100 || minor > 999 || patch > 999 )); then
            echo 'Komponen versi terlalu besar untuk versionCode Android' >&2
            exit 1
          fi
          code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          if (( code < 1 )); then echo 'versionCode harus positif' >&2; exit 1; fi
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Build dan tes APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ secrets.HRIS_RELEASE_API_BASE_URL }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          UPDATE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$API_BASE_URL" || "$API_BASE_URL" != https://* ]]; then
            echo 'Secret HRIS_RELEASE_API_BASE_URL harus berupa URL HTTPS' >&2
            exit 1
          fi
          gradle --no-daemon testDebugUnitTest assembleRelease \
            "-Phris.apiBaseUrl=$API_BASE_URL" "-Phris.versionName=$VERSION_NAME" "-Phris.versionCode=$VERSION_CODE" \
            "-Phris.updateRepo=$UPDATE_REPO"
      - name: Tanda tangani dan periksa APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          keyfile="$RUNNER_TEMP/hris-release.keystore"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keyfile"
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          unsigned=mobile/app/build/outputs/apk/release/app-release-unsigned.apk
          aligned="$RUNNER_TEMP/aligned.apk"
          "$tools_dir/zipalign" -f -p 4 "$unsigned" "$aligned"
          "$tools_dir/apksigner" sign --ks "$keyfile" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out hris-pejuang-release.apk "$aligned"
          "$tools_dir/apksigner" verify --verbose hris-pejuang-release.apk
      - name: Publikasikan GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" hris-pejuang-release.apk --verify-tag --title "$TAG" --generate-notes --latest
