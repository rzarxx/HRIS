name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Sama dengan server development; disesuaikan bila hosting produksi berbeda.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hris_ci?sslmode=disable
      SEED_SDM_PASSWORD: ci-only-password-untuk-seed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Auto-fix format (gofmt) dan sqlc pada PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          gofmt -w .
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          if [ -n "$(git status --porcelain .)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style(ci): auto-fix gofmt dan sqlc"
            git pull --rebase origin "${{ github.head_ref }}"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Buat database tes
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE hris_test"
      - name: Tes unit, kontrak, dan integrasi
        run: go test ./... -timeout 15m
        env:
          HRIS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hris_test?sslmode=disable
      - name: Tes integrasi tidak boleh terlewati
        run: |
          go test ./internal/integration -count=1 -v -run '^(TestReadiness|TestConcurrentChallengeReplay)$' | tee "$RUNNER_TEMP/integration-critical.log"
          grep -q -- "--- PASS: TestReadiness" "$RUNNER_TEMP/integration-critical.log"
          grep -q -- "--- PASS: TestConcurrentChallengeReplay/accepted " "$RUNNER_TEMP/integration-critical.log"
          grep -q -- "--- PASS: TestConcurrentChallengeReplay/rejected_outside_geofence " "$RUNNER_TEMP/integration-critical.log"
        env:
          HRIS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hris_test?sslmode=disable
      - name: Hasil generate sqlc harus mutakhir
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - name: Migrasi dan seed pada database bersih
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE hris_ci'
          go run ./cmd/migrate up
          go run ./cmd/seed
          go run ./cmd/seed --reset
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Mesin wajah SFace (D43) memakai cgo dan ONNX Runtime, jadi diuji terpisah: hasil Go dibandingkan
  # dengan OpenCV, dan ambang diuji terhadap semua pasangan foto contoh go-face-testdata. Foto dan
  # model tidak disimpan di repo.
  face-sface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TESTDATA: https://github.com/Kagami/go-face-testdata/raw/96ccafa591055ef57286ffed1c3d7e39d17140b7
      ZOO: https://media.githubusercontent.com/media/opencv/opencv_zoo/48b10fa505aeb51fbd127fc60a5c660040e823b7/models
      ORT_VERSION: 1.31.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: OpenCV untuk embedding acuan
        run: pip install --quiet numpy opencv-python-headless
      - name: ONNX Runtime, model, dan foto uji
        run: |
          D="$RUNNER_TEMP/face"
          mkdir -p "$D/models" "$D/images" "$D/group" "$D/ort"
          curl -fsSL -o "$D/ort.tgz" "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-linux-x64-$ORT_VERSION.tgz"
          curl -fsSL -o "$D/models/yunet.onnx" "$ZOO/face_detection_yunet/face_detection_yunet_2023mar.onnx"
          curl -fsSL -o "$D/models/sface.onnx" "$ZOO/face_recognition_sface/face_recognition_sface_2021dec.onnx"
          sha256sum -c <<EOF
          cc5c72baf5ae5c8238a6841f0897227be2d02826b9cf98eaf02fdefaeeb03a57  $D/ort.tgz
          8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4  $D/models/yunet.onnx
          0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79  $D/models/sface.onnx
          EOF
          tar -xzf "$D/ort.tgz" -C "$D/ort" --strip-components=1
          curl -fsSL -o "$D/group/pristin.jpg" "$TESTDATA/images/pristin.jpg"
          for i in bona bona2 bona3 bona4 chaeyeon chaeyeon2 chaeyeon3 chaeyoung chaeyoung2 elkie eunseo eunseo2 eunseo3 \
                   eunwoo jimin jimin2 jimin3 jimin4 jimin5 jimin6 jimin7 joy luda luda2 meiqi nana nayoung rena sejeong \
                   seulgi tzuyu tzuyu2 yujin; do
            curl -fsSL -o "$D/images/$i.jpg" "$TESTDATA/images/$i.jpg"
          done
      - name: Embedding acuan OpenCV
        run: python tools/face-bench/reference.py --images "$RUNNER_TEMP/face/images" --models "$RUNNER_TEMP/face/models" --out "$RUNNER_TEMP/face/reference.json"
      - name: Vet dan build API dengan ONNX
        run: |
          go vet -tags onnx ./internal/face/ ./cmd/api/
          # Repo checkout bisa dimiliki user lain; info versi tidak diperlukan untuk build uji.
          go build -buildvcs=false -tags onnx -o /dev/null ./cmd/api
      - name: Tes mesin wajah
        run: |
          export FACE_TESTDATA_DIR="$RUNNER_TEMP/face"
          export ONNXRUNTIME_LIB="$RUNNER_TEMP/face/ort/lib/libonnxruntime.so.$ORT_VERSION"
          export FACE_REFERENCE="$RUNNER_TEMP/face/reference.json"
          go test -tags onnx -count=1 -v ./internal/face/ 2>&1 | tee "$RUNNER_TEMP/face-test.log"
          # Pastikan tes ONNX benar-benar berjalan, bukan terlewati.
          for name in TestSFaceMatchesOpenCV TestSFaceEngineErrors TestSFaceEngine; do
            grep -q -- "--- PASS: $name " "$RUNNER_TEMP/face-test.log"
          done
  # Aplikasi Android (D44). Tidak ada wrapper Gradle di repo, jadi versinya dipasang di sini.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # recordPaparazziDebug menjalankan semua tes unit sekaligus merender layar ke PNG.
      - name: Build APK debug, tes unit, dan screenshot
        run: gradle --no-daemon --stacktrace assembleDebug recordPaparazziDebug assembleRelease -Phris.apiBaseUrl=https://example.invalid/
      - name: Uji tanda tangan APK rilis dengan kunci sementara
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.keystore" -storetype PKCS12 \
            -storepass ci-password -keypass ci-password -alias ci-key -keyalg RSA -keysize 2048 \
            -validity 2 -dname 'CN=CI Test' -noprompt
          export KEYSTORE_B64="$(base64 -w 0 "$RUNNER_TEMP/test.keystore")"
          export KEYSTORE_PASSWORD=ci-password KEY_ALIAS=ci-key KEY_PASSWORD=ci-password
          bash .github/scripts/sign-android-release.sh
          rm -f "$RUNNER_TEMP/test.keystore" hris-pejuang-release.apk
      - name: Simpan APK debug
        uses: actions/upload-artifact@v4
        with:
          name: hris-pejuang-debug-apk
          path: mobile/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Simpan screenshot layar
        uses: actions/upload-artifact@v4
        with:
          name: hris-pejuang-screenshots
          path: mobile/app/src/test/snapshots/images/
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Auto-fix OpenAPI schema dan ESLint pada PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm run gen:api
          npx eslint --fix . || true
          if [ -n "$(git status --porcelain .)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style(ci): auto-fix openapi schema dan eslint"
            git pull --rebase origin "${{ github.head_ref }}"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Tipe hasil generate harus mutakhir
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - name: Cek tipe
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pindai rahasia (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pindai kerentanan (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
