name: Uji banding model wajah

# Riset untuk memilih model wajah (D42). Tidak berjalan di setiap push karena mengunduh model
# sekitar 330 MB; jalankan manual dari tab Actions, atau otomatis saat skripnya berubah.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - backend/tools/face-bench/**
      - .github/workflows/face-bench.yml

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      TESTDATA: https://github.com/Kagami/go-face-testdata/raw/96ccafa591055ef57286ffed1c3d7e39d17140b7
      ZOO: https://media.githubusercontent.com/media/opencv/opencv_zoo/48b10fa505aeb51fbd127fc60a5c660040e823b7/models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pustaka Python
        run: pip install --quiet numpy opencv-python-headless onnxruntime dlib-bin
      - name: Foto contoh dan model
        run: |
          mkdir -p "$RUNNER_TEMP/bench/images" "$RUNNER_TEMP/bench/models"
          cd "$RUNNER_TEMP/bench"
          for i in bona bona2 bona3 bona4 chaeyeon chaeyeon2 chaeyeon3 chaeyoung chaeyoung2 elkie eunseo eunseo2 eunseo3 \
                   eunwoo jimin jimin2 jimin3 jimin4 jimin5 jimin6 jimin7 joy luda luda2 meiqi nana nayoung rena sejeong \
                   seulgi tzuyu tzuyu2 yujin; do
            curl -fsSL -o "images/$i.jpg" "$TESTDATA/images/$i.jpg"
          done
          curl -fsSL -o models/shape_predictor_5_face_landmarks.dat "$TESTDATA/models/shape_predictor_5_face_landmarks.dat"
          curl -fsSL -o models/dlib_face_recognition_resnet_model_v1.dat "$TESTDATA/models/dlib_face_recognition_resnet_model_v1.dat"
          curl -fsSL -o models/yunet.onnx "$ZOO/face_detection_yunet/face_detection_yunet_2023mar.onnx"
          curl -fsSL -o models/sface.onnx "$ZOO/face_recognition_sface/face_recognition_sface_2021dec.onnx"
          sha256sum -c <<'EOF'
          c4b1e9804792707d3a405c2c16a80a20269e6675021f64a41d30fffafbc41888  models/shape_predictor_5_face_landmarks.dat
          55533b28a95800a551ba546ba62fe69625c7e95a7061c338adffead08719da30  models/dlib_face_recognition_resnet_model_v1.dat
          8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4  models/yunet.onnx
          0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79  models/sface.onnx
          EOF
          # Pembanding saja: model InsightFace hanya boleh untuk riset non-komersial.
          curl -fsSL -o buffalo_l.zip https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip
          sha256sum buffalo_l.zip
          unzip -q -j buffalo_l.zip w600k_r50.onnx -d models
      - name: Uji banding
        run: python backend/tools/face-bench/bench.py --images "$RUNNER_TEMP/bench/images" --models "$RUNNER_TEMP/bench/models" --summary "$GITHUB_STEP_SUMMARY"
