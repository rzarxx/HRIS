                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
  /v1/admin/attendance/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Presensi]
      summary: Putuskan presensi review
      description: >-
        Permission `attendance:review`. `present` menghapus keterlambatan, `late` hanya untuk presensi yang memang terlambat, dan
        `absent` wajib memakai catatan. Presensi sendiri ditolak `CONFLICT_SELF_ACTION`, dan presensi yang sudah diputuskan ditolak `REQUEST_NOT_PENDING`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceResolveInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AttendanceResolved" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

