openapi: 3.0.3
info:
  title: HRIS Pejuang API
  version: 0.1.0
  description: |
    Kontrak API HRIS Pejuang. Acuan manusia ada di MASTER.md §7.

    **Autentikasi web:** login menyetel cookie `hris_at`, `hris_rt`, dan `hris_csrf`.
    Semua method selain GET wajib mengirim header `X-CSRF-Token` berisi nilai cookie `hris_csrf`.

    Mencakup auth web (termasuk MFA dan aktivasi), kelola akun, master data, lokasi kantor, shift, hari libur, pengumuman, dashboard, dan laporan.
servers:
  - url: http://localhost:8080
    description: Pengembangan lokal
tags:
  - name: Auth
  - name: Profil
  - name: Divisi
  - name: Subdiv
  - name: Pejuang
  - name: Akun
  - name: Presensi
  - name: Wajah
  - name: Perangkat
  - name: Lokasi
  - name: Shift
  - name: Pengumuman
  - name: Dashboard
  - name: Laporan
  - name: Sistem
security:
  - csrfToken: []
    cookieAuth: []
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [Sistem]
      summary: Liveness
      security: []
      responses:
        "200": { description: Server hidup }
  /readyz:
    get:
      tags: [Sistem]
      summary: Readiness (cek database)
      security: []
      responses:
        "200": { description: Siap }
        "503": { description: Database tidak terjangkau }

  /v1/auth/web/login:
    post:
      tags: [Auth]
      summary: Login web admin
      description: Menyetel cookie sesi. Gagal 5 kali berturut-turut mengunci akun 15 menit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { email: "{{email}}", password: "{{password}}" }
      responses:
        "200":
          description: Berhasil, cookie disetel
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
  /v1/auth/web/refresh:
    post:
      tags: [Auth]
      summary: Rotasi refresh token web
      description: Memakai cookie `hris_rt`. Token lama yang dipakai ulang mencabut sesi.
      responses:
        "204": { description: Cookie baru disetel }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Cabut sesi saat ini
      responses:
        "204": { description: "Sesi dicabut, cookie dihapus" }

  /v1/auth/web/mfa/verify:
    post:
      tags: [Auth]
      summary: Selesaikan login dengan kode TOTP atau kode pemulihan
      description: Memakai `mfa_token` dari `details` error AUTH_MFA_REQUIRED. Berlaku 5 menit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaVerifyRequest" }
      responses:
        "200":
          description: Berhasil, cookie disetel
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/mobile/login:
    post:
      tags: [Auth]
      summary: Login aplikasi mobile dan ikat perangkat
      description: "Perangkat pertama akun langsung approved, perangkat berikutnya pending sampai disetujui SDM (D32). Akun ber-MFA wajib mengirim mfa_code; tanpa kode dijawab AUTH_MFA_REQUIRED (D40). Perangkat yang dicabut ditolak DEVICE_REVOKED. Sesi berlaku 30 hari dan tidak diperpanjang."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileLoginRequest" }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MobileTokens" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/mobile/refresh:
    post:
      tags: [Auth]
      summary: Rotasi refresh token mobile
      description: Refresh token lama yang dipakai ulang mencabut sesi (F6). Sesi web dan perangkat yang dicabut ditolak.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileRefreshRequest" }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MobileTokens" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/activate:
    post:
      tags: [Auth]
      summary: Aktivasi akun dari undangan dan tetapkan kata sandi
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivateRequest" }
      responses:
        "204": { description: "Akun aktif, silakan masuk" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/activate/check:
    post:
      tags: [Auth]
      summary: Periksa tautan aktivasi sebelum form ditampilkan
      description: Tidak memakai tautan. Menjawab ACTIVATION_USED, ACTIVATION_EXPIRED, atau ACTIVATION_INVALID bila tautan tidak berlaku.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivationCheckRequest" }
      responses:
        "200":
          description: Tautan masih berlaku
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ActivationCheck" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/password/change:
    post:
      tags: [Auth]
      summary: Ganti kata sandi sendiri
      description: Mencabut sesi lain milik akun ini.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "204": { description: Kata sandi diganti }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/sessions:
    get:
      tags: [Auth]
      summary: Sesi aktif milik sendiri
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
  /v1/auth/sessions/{session_id}:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Auth]
      summary: Cabut satu sesi milik sendiri
      responses:
        "204": { description: Sesi dicabut }
        "404": { $ref: "#/components/responses/Error" }
  /v1/auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Mulai pendaftaran TOTP
      description: Menghasilkan secret baru. Belum aktif sampai dikonfirmasi lewat /v1/auth/mfa/enable.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MfaSetup" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/auth/mfa/enable:
    post:
      tags: [Auth]
      summary: Aktifkan TOTP dengan kode dari aplikasi authenticator
      description: Kode pemulihan hanya ditampilkan sekali.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaEnableRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MfaEnabled" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/me:
    get:
      tags: [Profil]
      summary: Profil dan permission pengguna
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/admin/divisions:
    get:
      tags: [Divisi]
      summary: Daftar divisi
      description: "Permission `org:write`."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Division" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Divisi]
      summary: Tambah divisi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DivisionInput" }
            example: { code: OPS, name: Operasional, head_employee_id: null }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Division" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/divisions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Divisi]
      summary: Ubah divisi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DivisionPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Division" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Divisi]
      summary: Hapus divisi
      description: Ditolak `CONFLICT_HAS_DEPENDENTS` bila masih memiliki subdiv.
      responses:
        "204": { description: Dihapus }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/subdivisions:
    get:
      tags: [Subdiv]
      summary: Daftar subdiv
      parameters:
        - { name: division_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Subdivision" }
    post:
      tags: [Subdiv]
      summary: Tambah subdiv
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubdivisionInput" }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Subdivision" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/subdivisions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Subdiv]
      summary: Ubah subdiv
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubdivisionPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Subdivision" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Subdiv]
      summary: Hapus subdiv
      description: Ditolak `CONFLICT_HAS_DEPENDENTS` bila masih memiliki Pejuang.
      responses:
        "204": { description: Dihapus }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/employees:
    get:
      tags: [Pejuang]
      summary: Daftar Pejuang
      description: "Permission `employee:read`, dibatasi scope. `base_salary` hanya untuk `sdm` dan pemilik data."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - { name: q, in: query, description: "Cari nama, NIPY, email, jabatan", schema: { type: string } }
        - { name: division_id, in: query, schema: { type: string, format: uuid } }
        - { name: subdivision_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/EmployeeStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Employee" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
    post:
      tags: [Pejuang]
      summary: Tambah Pejuang
      description: "Permission `employee:write`. `nip` kosong = dibuat otomatis. Membuat akun belum aktif beserta undangan aktivasi (F3)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
            example:
              full_name: Rudi Hartono
              nip: null
              email: rudi.hartono@pejuang.id
              phone: "081234567890"
              subdivision_id: 00000000-0000-4000-8000-000000000000
              position: Staf Lapangan
              join_date: "2026-11-02"
              base_salary: "4250000.00"
              status: active
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/EmployeeCreated" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/employees/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Pejuang]
      summary: Detail Pejuang
      description: Objek di luar scope dijawab 404.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Employee" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Pejuang]
      summary: Ubah Pejuang
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeePatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Employee" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/employees/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Pejuang]
      summary: Nonaktifkan Pejuang
      description: Riwayat presensi dan upah tetap tersimpan.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Employee" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{user_id}/reset-password:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Akun]
      summary: Terbitkan undangan baru untuk menetapkan sandi
      description: "Permission `user:manage`. Mencabut semua sesi. SDM tidak pernah mengetahui kata sandi."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Activation" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/users/{user_id}/lock:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Akun]
      summary: Kunci akun
      description: "Permission `user:manage`. Mencabut semua sesi."
      responses:
        "204": { description: Akun dikunci }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/users/{user_id}/unlock:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Akun]
      summary: Buka kunci akun
      description: "Permission `user:manage`."
      responses:
        "204": { description: Akun dibuka }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/users/{user_id}/revoke-sessions:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Akun]
      summary: Cabut semua sesi akun
      description: "Permission `user:manage`."
      responses:
        "204": { description: Sesi dicabut }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/attendance/challenge:
    post:
      tags: [Presensi]
      summary: Minta tantangan absen sekali pakai
      description: "Berlaku 90 detik dan terikat ke pengguna, perangkat, dan tujuan."
      parameters:
        - { name: X-Device-Id, in: header, required: true, description: "ID perangkat dari hasil registrasi", schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceChallengeInput" }
      responses:
        "201":
          description: Tantangan dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AttendanceChallenge" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/attendance/clock-in:
    post:
      tags: [Presensi]
      summary: Absen masuk
      description: "Kirim multipart: bagian `payload` (JSON `ClockInput`) dan berkas `selfie`. Server mencocokkan wajah dan memverifikasi token Play jika dikonfigurasi. JSON tanpa selfie hanya diterima dengan bypass development (D36). Tanpa verifikasi atau bypass tersebut, absen ditolak `ATTENDANCE_BLOCKED`. Alasan keamanan tidak dikirim ke klien."
      parameters:
        - { name: X-Device-Id, in: header, required: true, description: "ID perangkat dari hasil registrasi", schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload, selfie]
              properties:
                payload: { type: string, description: "JSON `ClockInput`" }
                selfie: { type: string, format: binary, description: "Selfie JPEG, maksimal 1 MB" }
            encoding:
              payload: { contentType: application/json }
              selfie: { contentType: image/jpeg }
          application/json:
            schema: { $ref: "#/components/schemas/ClockInput" }
      responses:
        "201":
          description: Absen masuk tercatat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ClockInResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/attendance/clock-out:
    post:
      tags: [Presensi]
      summary: Absen pulang
      description: "Dipasangkan dengan absen masuk yang masih terbuka, sampai batas cutoff harian berikutnya (D31)."
      parameters:
        - { name: X-Device-Id, in: header, required: true, description: "ID perangkat dari hasil registrasi", schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload, selfie]
              properties:
                payload: { type: string, description: "JSON `ClockInput`" }
                selfie: { type: string, format: binary, description: "Selfie JPEG, maksimal 1 MB" }
            encoding:
              payload: { contentType: application/json }
              selfie: { contentType: image/jpeg }
          application/json:
            schema: { $ref: "#/components/schemas/ClockInput" }
      responses:
        "200":
          description: Absen pulang tercatat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ClockOutResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/attendance:
    get:
      tags: [Presensi]
      summary: Riwayat absen sendiri
      description: "Bawaannya 31 hari terakhir, rentang maksimal 92 hari. Tidak memuat skor risiko."
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
