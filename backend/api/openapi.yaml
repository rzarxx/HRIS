      description: >-
        Tidak bisa untuk diri sendiri (`CONFLICT_SELF_ACTION`), dan izin super admin hanya bisa diatur super admin (D34).
        Izin yang berlaku pada tanggal yang sama dengan izin lain ditolak (`CONFLICT_DUPLICATE`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkArrangementInput" }
      responses:
