name: Android release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Plugin Paparazzi 2.0 butuh Gradle berjalan di JDK 21; aplikasi tetap dikompilasi untuk Java 17.
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Validasi tag dan buat versionCode
        id: version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Tag harus berupa versi stabil vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if (( ${#major} > 4 || ${#minor} > 3 || ${#patch} > 3 || major > 2100 || minor > 999 || patch > 999 )); then
            echo 'Komponen versi terlalu besar untuk versionCode Android' >&2
            exit 1
          fi
          code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          if (( code < 1 )); then echo 'versionCode harus positif' >&2; exit 1; fi
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # Aplikasi didistribusikan lewat Google Play (D52): build rilis selalu mengarah ke alamat
      # produksi bawaan (https://api.albahjah.or.id) dan dikemas sebagai Android App Bundle.
      - name: Build dan tes App Bundle
        working-directory: mobile
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          PLAY_CLOUD_PROJECT_NUMBER: ${{ secrets.HRIS_PLAY_CLOUD_PROJECT_NUMBER }}
        shell: bash
        run: |
          set -euo pipefail
          args=("-Phris.versionName=$VERSION_NAME" "-Phris.versionCode=$VERSION_CODE")
          if [[ -n "$PLAY_CLOUD_PROJECT_NUMBER" ]]; then
            args+=("-Phris.playCloudProjectNumber=$PLAY_CLOUD_PROJECT_NUMBER")
          fi
          gradle --no-daemon recordPaparazziDebug bundleRelease "${args[@]}"
      - name: Tanda tangani App Bundle dengan kunci unggah
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/sign-android-bundle.sh
      # Bundle tidak diterbitkan publik: diunduh pengelola dari artefak workflow lalu diunggah ke
      # Play Console. GitHub Release hanya berisi catatan perubahan.
      - uses: actions/upload-artifact@v4
        with:
          name: hris-yayasan-albahjah-${{ github.ref_name }}
          path: hris-yayasan-albahjah.aab
          retention-days: 30
          if-no-files-found: error
      - name: Catat GitHub Release tanpa berkas aplikasi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --latest
