name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Sama dengan server development; disesuaikan bila hosting produksi berbeda.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hris_ci?sslmode=disable
      SEED_SDM_PASSWORD: ci-only-password-untuk-seed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Buat database tes
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE hris_test"
      - name: Tes unit, kontrak, dan integrasi
        run: go test ./... -timeout 15m
        env:
          HRIS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hris_test?sslmode=disable
      - name: Tes integrasi tidak boleh terlewati
        run: |
          go test ./internal/integration -count=1 -v -run TestReadiness | tee /dev/stderr | grep -q -- "--- PASS: TestReadiness"
        env:
          HRIS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hris_test?sslmode=disable
      - name: Hasil generate sqlc harus mutakhir
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - name: Migrasi dan seed pada database bersih
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE hris_ci'
          go run ./cmd/migrate up
          go run ./cmd/seed
          go run ./cmd/seed --reset
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tipe hasil generate harus mutakhir
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - name: Cek tipe
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pindai rahasia (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pindai kerentanan (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
