openapi: 3.0.3
info:
  title: HRIS Pejuang API
  version: 0.1.0
  description: |
    Kontrak API HRIS Pejuang. Acuan manusia ada di MASTER.md §7.

    **Autentikasi web:** login menyetel cookie `hris_at`, `hris_rt`, dan `hris_csrf`.
    Semua method selain GET wajib mengirim header `X-CSRF-Token` berisi nilai cookie `hris_csrf`.

    Mencakup auth web (termasuk MFA dan aktivasi), kelola akun, master data, lokasi kantor, shift, hari libur, pengumuman, dashboard, dan laporan.
servers:
  - url: http://localhost:8080
    description: Pengembangan lokal
tags:
  - name: Auth
  - name: Profil
  - name: Cabang
    description: Cabang yayasan dengan struktur sendiri (D53)
  - name: Divisi
  - name: Subdiv
  - name: Pejuang
  - name: Akun
  - name: Presensi
  - name: Wajah
  - name: Perangkat
  - name: Lokasi
  - name: Shift
  - name: Pengumuman
  - name: Dashboard
  - name: Laporan
  - name: Pengajuan
  - name: Sistem
security:
  - csrfToken: []
    cookieAuth: []
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [Sistem]
      summary: Liveness
      security: []
      responses:
        "200": { description: Server hidup }
  /readyz:
    get:
      tags: [Sistem]
      summary: Readiness (cek database)
      security: []
      responses:
        "200": { description: Siap }
        "503": { description: Database tidak terjangkau }

  /v1/auth/web/login:
    post:
      tags: [Auth]
      summary: Login web admin
      description: "Menyetel cookie sesi. `identifier` boleh NIPY, email, atau nomor WA (D53). Gagal 5 kali berturut-turut mengunci akun 15 menit. Kata sandi awal yang lewat 72 jam dijawab `AUTH_INITIAL_PASSWORD_EXPIRED`."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { identifier: "{{identifier}}", password: "{{password}}" }
      responses:
        "200":
          description: Berhasil, cookie disetel
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
  /v1/auth/web/refresh:
    post:
      tags: [Auth]
      summary: Rotasi refresh token web
      description: Memakai cookie `hris_rt`. Token lama yang dipakai ulang mencabut sesi.
      responses:
        "204": { description: Cookie baru disetel }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Cabut sesi saat ini
      responses:
        "204": { description: "Sesi dicabut, cookie dihapus" }

  /v1/auth/web/mfa/verify:
    post:
      tags: [Auth]
      summary: Selesaikan login dengan kode TOTP atau kode pemulihan
      description: Memakai `mfa_token` dari `details` error AUTH_MFA_REQUIRED. Berlaku 5 menit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaVerifyRequest" }
      responses:
        "200":
          description: Berhasil, cookie disetel
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/mobile/login:
    post:
      tags: [Auth]
      summary: Login aplikasi mobile dan ikat perangkat
      description: "Perangkat pertama akun langsung approved, perangkat berikutnya pending sampai disetujui SDM (D32). Akun ber-MFA wajib mengirim mfa_code; tanpa kode dijawab AUTH_MFA_REQUIRED (D40). Perangkat yang dicabut ditolak DEVICE_REVOKED. Sesi berlaku 30 hari dan tidak diperpanjang."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileLoginRequest" }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MobileTokens" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/mobile/refresh:
    post:
      tags: [Auth]
      summary: Rotasi refresh token mobile
      description: Refresh token lama yang dipakai ulang mencabut sesi (F6). Sesi web dan perangkat yang dicabut ditolak.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileRefreshRequest" }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MobileTokens" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/branding:
    get:
      tags: [Sistem]
      summary: Teks merek dan footer untuk web admin dan aplikasi
      description: >-
        Tanpa login, karena footer juga tampil di layar masuk. `footer` sudah jadi dengan `{tahun}` diganti tahun
        berjalan (WIB); `footer_template` adalah teks yang diatur super admin.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Branding" }
  /v1/app/version:
    get:
      tags: [Sistem]
      summary: Versi aplikasi Android terbaru dan minimum
      description: >-
        Tanpa login dan tetap dilayani untuk aplikasi lama (D63). Kode versi sama dengan versionCode aplikasi
        (major·1.000.000 + minor·1.000 + patch, mis. 0.14.0 = 14000). Aplikasi menampilkan pemberitahuan bila `latest_code` lebih tinggi
        dari versinya, dan layar wajib perbarui bila di bawah `min_code`. Permintaan aplikasi dengan header
        `X-App-Version` di bawah `min_code` dijawab 426 `APP_UPDATE_REQUIRED` (kecuali endpoint ini, branding,
        login, refresh, dan logout aplikasi). Nol berarti belum diatur.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AppVersion" }
  /v1/auth/password/change:
    post:
      tags: [Auth]
      summary: Ganti kata sandi sendiri
      description: Mencabut sesi lain milik akun ini.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "204": { description: Kata sandi diganti }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Minta tautan atur ulang kata sandi lewat email
      security: []
      description: >-
        Publik (D30). Selalu menjawab 202 dengan pesan yang sama, baik akun ada atau tidak, punya email atau tidak,
        agar tidak membocorkan akun mana yang terdaftar. Tautan hanya dikirim ke email terdaftar akun aktif bila
        SMTP sudah diatur super admin dan PUBLIC_WEB_URL terisi. Tautan sekali pakai, berlaku 1 jam, dan tautan
        baru membatalkan yang lama. Dibatasi 3 permintaan per jam per akun dan IP, serta 10 per jam per IP.
        Dicatat `auth.password_reset_requested`; gagal kirim dicatat `email.delivery_failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordForgotRequest" }
      responses:
        "202":
          description: Diterima
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PasswordForgotResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Pasang kata sandi baru dari tautan email
      security: []
      description: >-
        Publik. `token` diambil web dari fragmen URL tautan email (`/reset-kata-sandi/#token=…`). Kata sandi baru
        minimal 10 karakter dan bukan kata sandi umum; isian yang belum sesuai tidak menghabiskan tautan. Berhasil
        berarti akun dibuka kuncinya, kata sandi awal tidak berlaku lagi, dan semua sesi dicabut. MFA tetap diminta
        saat login berikutnya. Dicatat `auth.password_reset_completed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, maxLength: 128 }
                password: { type: string, maxLength: 256 }
      responses:
        "204": { description: Kata sandi baru terpasang }
        "400":
          description: VALIDATION_FAILED, atau RESET_TOKEN_INVALID bila tautan salah, kedaluwarsa, atau sudah dipakai
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/email/confirm:
    post:
      tags: [Auth]
      summary: Konfirmasi email baru dari tautan email
      security: []
      description: >-
        Publik (D59). `token` diambil web dari fragmen URL tautan di email baru (`/konfirmasi-email/#token=…`).
        Tautan sekali pakai dan berlaku 24 jam. Berhasil berarti email Pejuang dan email login berubah dalam satu
        transaksi, semua sesi dicabut, dan email lama diberi tahu. Dicatat `user.email_changed`. Dibatasi 10 per
        jam per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 128 }
      responses:
        "204": { description: Email baru berlaku }
        "400":
          description: EMAIL_CHANGE_INVALID bila tautan salah, kedaluwarsa, atau sudah dipakai
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/sessions:
    get:
      tags: [Auth]
      summary: Sesi aktif milik sendiri
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
  /v1/auth/sessions/{session_id}:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Auth]
      summary: Cabut satu sesi milik sendiri
      responses:
        "204": { description: Sesi dicabut }
        "404": { $ref: "#/components/responses/Error" }
  /v1/auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Mulai pendaftaran TOTP
      description: Menghasilkan secret baru. Belum aktif sampai dikonfirmasi lewat /v1/auth/mfa/enable.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MfaSetup" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/auth/mfa/enable:
    post:
      tags: [Auth]
      summary: Aktifkan TOTP dengan kode dari aplikasi authenticator
      description: Kode pemulihan hanya ditampilkan sekali.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaEnableRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MfaEnabled" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/me:
    get:
      tags: [Profil]
      summary: Profil dan permission pengguna
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Profil]
      summary: Ubah nomor WA dan email sendiri
      description: >-
        Permission `profile:update`. Field yang tidak dikirim tetap nilai lamanya; `null` mengosongkan. Mengganti
        email wajib menyertakan `current_password` karena email dipakai untuk masuk. Bila SMTP aktif (D59), email
        baru belum berlaku: tautan konfirmasi dikirim ke email baru, email lama diberi tahu, dan `pending_email`
        terisi sampai tautan dibuka (dicatat `user.email_change_requested`, maks 3 per jam, lebih dari itu
        `RATE_LIMITED`). Tanpa SMTP, email login berubah langsung dan dicatat `user.email_changed`. Perubahan
        lain dicatat `employee.updated` dengan nama field saja.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: Profil terbaru
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/me/email-change:
    delete:
      tags: [Profil]
      summary: Batalkan ganti email yang belum dikonfirmasi
      description: Permission `profile:update`. Tautan konfirmasi yang sudah terkirim tidak berlaku lagi (D59).
      responses:
        "204": { description: Dibatalkan }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/me/children:
    get:
      tags: [Profil]
      summary: Data anak milik sendiri
      description: >-
        Permission `profile:read`. Data anak hanya terlihat oleh Pejuang sendiri, SDM, dan super admin. Pejuang
        hanya membaca; data anak diubah SDM lewat form Pejuang atau impor xlsx.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MyFamily" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/me/photo:
    put:
      tags: [Profil]
      summary: Unggah foto profil sendiri
      description: >-
        Permission `profile:update`. Body adalah isi berkas JPEG atau PNG (maks 5 MB, dicek dari magic bytes).
        Server memotong gambar menjadi persegi di tengah, memperkecilnya ke 512 px, lalu menyimpannya ulang
        sebagai JPEG sehingga metadata (EXIF, termasuk lokasi) terbuang. Berkas disimpan terenkripsi.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Profil terbaru
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Profil]
      summary: Hapus foto profil sendiri
      description: Permission `profile:update`.
      responses:
        "204": { description: Foto dihapus }
        "403": { $ref: "#/components/responses/Error" }

  /v1/employees/{id}/photo:
    get:
      tags: [Profil]
      summary: Foto profil Pejuang
      description: >-
        Permission `profile:read` untuk foto sendiri; foto Pejuang lain memerlukan `employee:read` dalam
        scope pemanggil. Jawaban `Cache-Control: private, no-store`. `404` bila Pejuang belum punya foto.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Foto JPEG 512x512
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/branches:
    get:
      tags: [Cabang]
      summary: Daftar cabang
      description: "Permission `org:write`. Cabang punya divisi, subdiv, dan atasan sendiri (D53)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Branch" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Cabang]
      summary: Tambah cabang
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchInput" }
            example: { code: CRB, name: Cabang Cirebon }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Branch" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/branches/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Cabang]
      summary: Ubah cabang
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Branch" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Cabang]
      summary: Hapus cabang
      description: Ditolak `CONFLICT_HAS_DEPENDENTS` bila masih memiliki divisi.
      responses:
        "204": { description: Dihapus }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/divisions:
    get:
      tags: [Divisi]
      summary: Daftar divisi
      description: "Permission `org:write`."
      parameters:
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Division" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Divisi]
      summary: Tambah divisi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DivisionInput" }
            example: { branch_id: 00000000-0000-4000-8000-000000000000, code: OPS, name: Operasional, head_employee_id: null }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Division" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/divisions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Divisi]
      summary: Ubah divisi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DivisionPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Division" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Divisi]
      summary: Hapus divisi
      description: Ditolak `CONFLICT_HAS_DEPENDENTS` bila masih memiliki subdiv.
      responses:
        "204": { description: Dihapus }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/subdivisions:
    get:
      tags: [Subdiv]
      summary: Daftar subdiv
      parameters:
        - { name: division_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Subdivision" }
    post:
      tags: [Subdiv]
      summary: Tambah subdiv
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubdivisionInput" }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Subdivision" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/subdivisions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Subdiv]
      summary: Ubah subdiv
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubdivisionPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Subdivision" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Subdiv]
      summary: Hapus subdiv
      description: Ditolak `CONFLICT_HAS_DEPENDENTS` bila masih memiliki Pejuang.
      responses:
        "204": { description: Dihapus }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/employees:
    get:
      tags: [Pejuang]
      summary: Daftar Pejuang
      description: "Permission `employee:read`, dibatasi scope. `base_salary` hanya untuk `sdm` dan pemilik data."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - { name: q, in: query, description: "Cari nama, NIPY, email, nomor WA, jabatan", schema: { type: string } }
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: division_id, in: query, schema: { type: string, format: uuid } }
        - { name: subdivision_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/EmployeeStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Employee" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
    post:
      tags: [Pejuang]
      summary: Tambah Pejuang
      description: "Permission `employee:write`. `nip` kosong = dibuat otomatis. Membuat akun aktif dengan kata sandi awal `@NamaDepan`+tahun yang wajib diganti saat login pertama (D53). Kata sandi awal hanya tampil di respons ini."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
            example:
              full_name: Rudi Hartono
              nip: null
              email: rudi.hartono@pejuang.id
              phone: "081234567890"
              gender: L
              marital_status: menikah
              has_children: true
              children_count: 1
              children:
                - { child_order: 1, full_name: Aisyah, gender: P, birth_place: Cirebon, birth_date: "2015-04-02", relation: kandung, education: sd_mi, school_name: MI Al Bahjah }
              subdivision_id: 00000000-0000-4000-8000-000000000000
              position: Staf Lapangan
              join_date: "2026-11-02"
              base_salary: "4250000.00"
              status: active
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/EmployeeCreated" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/employees/import-template:
    get:
      tags: [Pejuang]
      summary: Unduh template xlsx impor Pejuang
      description: >-
        Permission `employee:write`. Sheet Pejuang berisi kolom formulir yayasan dengan daftar pilihan (cabang,
        divisi, subdiv, peran, shift, lokasi 1–3, jenis kelamin, status pernikahan, status dan pendidikan anak).
        Sheet Struktur berisi pasangan cabang–divisi–subdiv yang berlaku; sheet Lokasi dan Shift berisi data
        terdaftar (berlatar abu-abu) dan baris kosong untuk data baru; ditambah sheet Petunjuk.
      responses:
        "200":
          description: Berkas xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/employees/import:
    post:
      tags: [Pejuang]
      summary: Impor massal Pejuang dari xlsx
      description: >-
        Permission `employee:write`. Body adalah isi berkas xlsx dari template (maks 5 MB, 1.000 baris).
        Semua baris diperiksa lebih dulu; bila ada `issues`, tidak ada yang disimpan. NIPY yang sudah terdaftar
        memperbarui data Pejuang tersebut tanpa mengubah kata sandinya, dan sel kosong tidak mengubah data lama.
        Baris lain dibuat sebagai Pejuang baru dengan kata sandi awal (D53). Cabang, divisi, dan subdiv yang belum
        ada dibuat otomatis (butuh `org:write`), begitu juga lokasi baru di sheet Lokasi (`location:manage`) dan
        shift baru di sheet Shift (`shift:manage`); daftarnya ada di `new_items`. Kolom Peran memasang kepala
        subdiv atau divisi dan role akun ikut disesuaikan (D49). Lokasi 1–3 menggantikan lokasi presensi Pejuang.
        `dry_run=true` (bawaan) memeriksa semuanya di transaksi yang dibatalkan; `dry_run=false` menyimpan dalam
        satu transaksi.
      parameters:
        - { name: dry_run, in: query, schema: { type: boolean, default: true } }
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Hasil pemeriksaan atau penyimpanan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/EmployeeImportResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /v1/admin/employees/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Pejuang]
      summary: Detail Pejuang
      description: "Objek di luar scope dijawab 404. `children` hanya untuk SDM, super admin, dan Pejuang sendiri (D53)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Employee" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Pejuang]
      summary: Ubah Pejuang
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeePatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Employee" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/employees/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Pejuang]
      summary: Nonaktifkan Pejuang
      description: Riwayat presensi dan ubar tetap tersimpan.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Employee" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{user_id}/reset-password:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Akun]
      summary: Kembalikan akun ke kata sandi awal
      description: "Permission `user:manage`. Mencabut semua sesi dan membuka kunci. Kata sandi awal `@NamaDepan`+tahun wajib diganti saat login berikutnya (D53)."
      responses:
