      properties:
        cursor: { type: string, description: Kunci terakhir yang sudah diperiksa }
        scanned: { type: integer }
        copied: { type: integer }
        done: { type: boolean }
        updated_at: { type: string, format: date-time }
    StorageInput:
      type: object
      required: [endpoint, bucket, region, access_key]
      properties:
        endpoint: { type: string, format: uri, description: URL HTTPS tanpa path atau HTTP loopback }
