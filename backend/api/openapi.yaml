            properties:
              division: { type: string }
              subdivision_count: { type: integer }
    AttendanceReportRow:
      type: object
      required:
        [employee_id, nip, full_name, division, subdivision, work_days, present, late, leave, leave_quota, leave_non_quota, leave_other,
         leave_unpaid, leave_by_type, absent, review, late_minutes, worked_minutes, missed_clock_out]
      properties:
        employee_id: { type: string, format: uuid }
        nip: { type: string }
        full_name: { type: string }
        division: { type: string }
        subdivision: { type: string }
        work_days: { type: number, description: "Hadir, menunggu review, cuti, dan alpha; hari dari shift setengah hari dihitung 0,5 (D61)" }
        present: { type: integer, description: Hadir termasuk telat }
        late: { type: integer }
        leave: { type: integer, description: "Hari berstatus cuti/izin; sama dengan leave_quota + leave_non_quota + leave_other" }
        leave_quota: { type: integer, description: "Hari cuti dari jenis bersaldo (quota_kind statutory/custom)" }
        leave_non_quota: { type: integer, description: "Hari cuti dari jenis tanpa saldo (quota_kind none)" }
        leave_other: { type: integer, description: "Hari cuti tanpa pengajuan disetujui yang mencakup tanggalnya" }
        leave_unpaid: { type: integer, description: "Hari cuti dari jenis yang tidak dibayar (paid false)" }
        leave_by_type:
          type: array
