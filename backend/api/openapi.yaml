        work_mode: { type: string, enum: [onsite, wfa, field] }
        location_name: { type: string, nullable: true }
    DeviceStatus:
      type: string
      enum: [pending, approved, revoked]
    DeviceIntegrityTier:
      type: string
      description: "Jalur verifikasi perangkat (MASTER.md §5.4.1). Ditetapkan server; klien tidak bisa memilih."
      enum: [play, attestation, manual, kiosk]
    DeviceRegisterInput:
      type: object
      required: [device_hash]
      properties:
        device_hash: { type: string, pattern: '^[a-f0-9]{64}$', description: "SHA-256 dari ID instalasi acak, bukan IMEI" }
        model: { type: string, nullable: true, maxLength: 100 }
        os_version: { type: string, nullable: true, maxLength: 50 }
        fcm_token: { type: string, nullable: true, maxLength: 4096 }
        public_key: { type: string, nullable: true, maxLength: 400, description: "Kunci publik ECDSA P-256 instalasi (PKIX DER, base64 standar). Diikat sekali ke perangkat dan tidak pernah ditimpa." }
    DeviceTierInput:
