name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Sama dengan server development; disesuaikan bila hosting produksi berbeda.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hris_ci?sslmode=disable
      SEED_SDM_PASSWORD: ci-only-password-untuk-seed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Buat database tes
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE hris_test"
      - name: Tes unit, kontrak, dan integrasi
        run: go test ./... -timeout 15m
        env:
          HRIS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hris_test?sslmode=disable
      - name: Tes integrasi tidak boleh terlewati
        run: |
          go test ./internal/integration -count=1 -v -run TestReadiness | tee /dev/stderr | grep -q -- "--- PASS: TestReadiness"
        env:
          HRIS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hris_test?sslmode=disable
      - name: Hasil generate sqlc harus mutakhir
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - name: Migrasi dan seed pada database bersih
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE hris_ci'
          go run ./cmd/migrate up
          go run ./cmd/seed
          go run ./cmd/seed --reset
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Mesin wajah dlib (D42) hanya dibangun dengan cgo, jadi diuji terpisah dengan model dan foto
  # contoh dari go-face-testdata. Foto tidak disimpan di repo.
  face-dlib:
    runs-on: ubuntu-latest
    # Sama dengan server development (Ubuntu 22.04). Runner terbaru tidak lagi punya libatlas-base-dev.
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      TESTDATA: https://github.com/Kagami/go-face-testdata/raw/96ccafa591055ef57286ffed1c3d7e39d17140b7
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Pustaka dlib dan alat build
        working-directory: /
        run: |
          apt-get update -q
          apt-get install -y -q ca-certificates curl git build-essential libdlib-dev libblas-dev libatlas-base-dev liblapack-dev libjpeg-turbo8-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Model dan foto uji
        run: |
          mkdir -p "$RUNNER_TEMP/face/models" "$RUNNER_TEMP/face/images"
          cd "$RUNNER_TEMP/face"
          for m in shape_predictor_5_face_landmarks.dat dlib_face_recognition_resnet_model_v1.dat mmod_human_face_detector.dat; do curl -fsSL -o "models/$m" "$TESTDATA/models/$m"; done
          echo "c4b1e9804792707d3a405c2c16a80a20269e6675021f64a41d30fffafbc41888  models/shape_predictor_5_face_landmarks.dat" | sha256sum -c
          echo "55533b28a95800a551ba546ba62fe69625c7e95a7061c338adffead08719da30  models/dlib_face_recognition_resnet_model_v1.dat" | sha256sum -c
          echo "4cb19393e2fbaf2b1609a9319ad5386618c886a6234ec1b971f3e87c85d87fe6  models/mmod_human_face_detector.dat" | sha256sum -c
          for i in bona bona2 jimin pristin; do curl -fsSL -o "images/$i.jpg" "$TESTDATA/images/$i.jpg"; done
      - name: Vet dan build API dengan dlib
        run: |
          go vet -tags dlib ./internal/face/ ./cmd/api/
          go build -tags dlib -o /dev/null ./cmd/api
      - name: Tes mesin wajah
        run: |
          FACE_TESTDATA_DIR="$RUNNER_TEMP/face" go test -tags dlib -count=1 -v ./internal/face/ | tee /dev/stderr | grep -q -- "--- PASS: TestDlibEngine"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tipe hasil generate harus mutakhir
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - name: Cek tipe
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pindai rahasia (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pindai kerentanan (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
