          description: Sisa detik sebelum "Sudah baca" diterima, dihitung server saat respons dibuat. Nol bila sudah dibaca.
        attachments:
          type: array
          items: { $ref: "#/components/schemas/AnnouncementAttachment" }
    AnnouncementReader:
      type: object
