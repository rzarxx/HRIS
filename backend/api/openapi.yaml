                  data: { $ref: "#/components/schemas/InitialCredential" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/users/{user_id}/lock:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Akun]
      summary: Kunci akun
      description: "Permission `user:manage`. Mencabut semua sesi."
      responses:
        "204": { description: Akun dikunci }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/users/{user_id}/unlock:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Akun]
      summary: Buka kunci akun
      description: "Permission `user:manage`."
      responses:
        "204": { description: Akun dibuka }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/users/{user_id}/revoke-sessions:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Akun]
      summary: Cabut semua sesi akun
      description: "Permission `user:manage`."
      responses:
        "204": { description: Sesi dicabut }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{user_id}/role:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Akun]
      summary: Jadikan SDM atau kembalikan ke Pejuang
      description: >-
        Permission `account:manage` (hanya super admin, D60). Hanya `pejuang` ↔ `sdm`: kepala unit mengikuti
        struktur organisasi dan super admin hanya lewat perintah server (`ACCOUNT_CHANGE_NOT_ALLOWED`). Akun sendiri
        ditolak (`CONFLICT_SELF_ACTION`). Semua sesi akun dicabut agar peran baru langsung berlaku; akun yang baru
        menjadi SDM wajib mengaktifkan A2F kecuali dijadikan opsional. Dicatat `user.role_changed` dengan sumber
        `panel`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [sdm, pejuang] }
      responses:
        "204": { description: Peran diubah }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{user_id}/mfa-policy:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Akun]
      summary: Atur A2F wajib atau opsional untuk akun SDM
      description: >-
        Permission `account:manage` (hanya super admin, D60). Hanya untuk akun SDM; super admin selalu wajib A2F
        (`ACCOUNT_CHANGE_NOT_ALLOWED`). Opsional tidak mematikan A2F yang sudah aktif. Dicatat
        `user.mfa_policy_changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [required]
              properties:
                required: { type: boolean }
      responses:
        "204": { description: Tersimpan }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/attendance/challenge:
    post:
      tags: [Presensi]
      summary: Minta tantangan presensi sekali pakai
      description: "Berlaku 90 detik dan terikat ke pengguna, perangkat, dan tujuan."
      parameters:
        - { name: X-Device-Id, in: header, required: true, description: "ID perangkat dari hasil registrasi", schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceChallengeInput" }
      responses:
        "201":
          description: Tantangan dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AttendanceChallenge" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/attendance/clock-in:
    post:
      tags: [Presensi]
      summary: Presensi masuk
      description: "Kirim multipart: bagian `payload` (JSON `ClockInput`) dan berkas `selfie`. Server mencocokkan wajah dan memverifikasi token Play jika dikonfigurasi. JSON tanpa selfie hanya diterima dengan bypass development (D36). Tanpa verifikasi atau bypass tersebut, presensi ditolak `ATTENDANCE_BLOCKED`. Alasan keamanan tidak dikirim ke klien."
      parameters:
        - { name: X-Device-Id, in: header, required: true, description: "ID perangkat dari hasil registrasi", schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload, selfie, gesture]
              properties:
                payload: { type: string, description: "JSON `ClockInput`" }
                selfie: { type: string, format: binary, description: "Selfie JPEG lurus, maksimal 1 MB" }
                gesture: { type: string, format: binary, description: "Foto JPEG saat kepala menoleh sesuai `liveness_action`, maksimal 1 MB (D50)" }
            encoding:
              payload: { contentType: application/json }
              selfie: { contentType: image/jpeg }
              gesture: { contentType: image/jpeg }
          application/json:
            schema: { $ref: "#/components/schemas/ClockInput" }
      responses:
        "201":
          description: Presensi masuk tercatat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ClockInResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/attendance/clock-out:
    post:
      tags: [Presensi]
      summary: Presensi pulang
      description: "Dipasangkan dengan presensi masuk yang masih terbuka, sampai batas cutoff harian berikutnya (D31)."
      parameters:
        - { name: X-Device-Id, in: header, required: true, description: "ID perangkat dari hasil registrasi", schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload, selfie, gesture]
              properties:
                payload: { type: string, description: "JSON `ClockInput`" }
                selfie: { type: string, format: binary, description: "Selfie JPEG lurus, maksimal 1 MB" }
                gesture: { type: string, format: binary, description: "Foto JPEG saat kepala menoleh sesuai `liveness_action`, maksimal 1 MB (D50)" }
            encoding:
              payload: { contentType: application/json }
              selfie: { contentType: image/jpeg }
              gesture: { contentType: image/jpeg }
          application/json:
            schema: { $ref: "#/components/schemas/ClockInput" }
      responses:
        "200":
          description: Presensi pulang tercatat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ClockOutResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/attendance:
    get:
      tags: [Presensi]
      summary: Riwayat presensi sendiri
      description: "Bawaannya 31 hari terakhir, rentang maksimal 92 hari. Tidak memuat skor risiko."
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AttendanceRecord" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
  /v1/face/status:
    get:
      tags: [Wajah]
      summary: Status wajah sendiri
      description: "Permission `face:enroll`. Template wajah tidak pernah dikirim ke klien."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/FaceStatus" }
  /v1/face/enroll:
    post:
      tags: [Wajah]
      summary: Daftarkan wajah (F7)
      description: "Permission `face:enroll`. Butuh perangkat approved, challenge `face_enroll`, persetujuan biometrik, liveness, dan lokasi di dalam geofence kantor atau izin jarak jauh satu kali dari SDM. Server menghitung wajah dari setiap selfie menggunakan SFace; selfie yang tidak saling mirip ditolak. Template lama dinonaktifkan. Verifikasi token Play diperlukan jika dikonfigurasi; tanpa verifier atau bypass development pendaftaran ditolak (D36)."
      parameters:
        - { name: X-Device-Id, in: header, required: true, description: "ID perangkat dari hasil registrasi", schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload, samples, gesture]
              properties:
                payload: { type: string, description: "JSON `FaceEnrollInput`" }
                samples:
                  type: array
                  minItems: 3
                  maxItems: 5
                  description: "3 sampai 5 selfie JPEG berbeda, masing-masing maksimal 1 MB, berurutan sesuai `sample_sha256`"
                  items: { type: string, format: binary }
                gesture: { type: string, format: binary, description: "Foto JPEG saat kepala menoleh sesuai `liveness_action`, maksimal 1 MB (D50)" }
            encoding:
              payload: { contentType: application/json }
              samples: { contentType: image/jpeg }
              gesture: { contentType: image/jpeg }
      responses:
        "201":
          description: Wajah terdaftar
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/FaceStatus" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/consents:
    post:
      tags: [Wajah]
      summary: Catat persetujuan pengguna
      description: "Untuk diri sendiri. Persetujuan biometrik juga dicatat otomatis saat pendaftaran wajah."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentInput" }
      responses:
