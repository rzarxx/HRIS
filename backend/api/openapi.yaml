                properties:
                  data: { $ref: "#/components/schemas/Announcement" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Pengumuman]
      summary: Hapus pengumuman
      responses:
        "204": { description: Dihapus }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/announcements/{id}/reads:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Pengumuman]
      summary: Status baca tiap Pejuang sasaran
      description: >-
        Permission `announcement:manage`. Sasaran adalah Pejuang aktif di divisi tujuan, atau semua bila pengumuman
        untuk semua divisi. Urutan: belum membuka, sudah membuka tetapi belum membaca, lalu sudah membaca.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AnnouncementReader" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/announcements/{id}/attachments:
    post:
      tags: [Pengumuman]
      summary: Tambah lampiran pengumuman
      description: >-
        Permission `announcement:manage`. Body adalah isi berkas PDF, JPEG, atau PNG (maks 5 MB, jenis dicek dari
        magic bytes); nama berkas dari query `name`. Paling banyak 5 lampiran per pengumuman. Berkas disimpan
        terenkripsi di penyimpanan privat server dan dicatat sebagai `announcement.updated`.
        Semua lampiran dipindai ClamAV sebelum disimpan. FILE_UNSAFE (422) menolak berkas berbahaya;
        FILE_SCAN_UNAVAILABLE (503) menolak unggahan bila pemindai tidak tersedia. Gambar didekode ulang,
        dibatasi 24 juta piksel dan diperkecil proporsional sampai 2560 px; JPEG kualitas 85, PNG tetap
        transparan. Gzip sebelum enkripsi digunakan bila lebih kecil; isi PDF tidak diubah.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: query, required: true, schema: { type: string, maxLength: 120 } }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Pengumuman beserta daftar lampiran terbaru
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Announcement" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/announcements/{id}/attachments/{attachment_id}:
    delete:
      tags: [Pengumuman]
      summary: Hapus lampiran pengumuman
      description: Permission `announcement:manage`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: attachment_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Lampiran dihapus }
        "404": { $ref: "#/components/responses/Error" }
  /v1/announcements/{id}/attachments/{attachment_id}:
    get:
      tags: [Pengumuman]
      summary: Unduh lampiran pengumuman
      description: >-
        Permission `announcement:read`. Hanya untuk pengumuman yang sedang tayang bagi pemanggil; pemegang
        `announcement:manage` boleh mengunduh lampiran pengumuman apa pun. Jawaban `Cache-Control: private, no-store`.
        Isi didekompresi oleh server untuk pratinjau langsung. Lampiran lama dipindai sebelum dikirim;
        FILE_UNSAFE (422) atau FILE_SCAN_UNAVAILABLE (503) menghalangi pengiriman jika tidak lolos.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: attachment_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Isi berkas
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/announcements/active:
    get:
      tags: [Pengumuman]
      summary: Pengumuman yang sedang tayang untuk saya
      description: >-
        Permission `announcement:read`. Aktif, sudah mulai tayang, belum berakhir, dan untuk divisi saya atau semua
        divisi. Belum dibaca tampil lebih dulu, paling banyak 50. Aplikasi memanggilnya saat dibuka (MASTER.md §7,
        notifikasi push menyusul).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MyAnnouncement" }
  /v1/announcements/{id}/open:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Pengumuman]
      summary: Catat isi pengumuman dibuka
      description: >-
        Permission `announcement:read`. Waktu buka dicatat sekali saja; pemanggilan berikutnya tidak memulai ulang
        timer baca (D27). Pengumuman yang tidak tayang untuk saya dijawab 404.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MyAnnouncement" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/announcements/{id}/read:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Pengumuman]
      summary: Tandai pengumuman sudah dibaca
      description: >-
        Permission `announcement:read`. Ditolak `422 READ_TOO_SOON` bila isi belum dibuka atau jeda
        `min_read_seconds` sejak dibuka belum lewat; `details.wait_seconds` berisi sisa detik. Idempoten setelah dibaca.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MyAnnouncement" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/admin/settings/footer:
    get:
      tags: [Sistem]
      summary: Footer saat ini
      description: Permission `settings:manage` (hanya super admin).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Branding" }
    put:
      tags: [Sistem]
      summary: Ubah footer web admin dan aplikasi
      description: >-
        Permission `settings:manage` (hanya super admin). Teks murni satu baris, paling banyak 200 karakter; `{tahun}`
        diganti tahun berjalan. Null atau kosong mengembalikan teks bawaan. Dicatat sebagai `settings.changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FooterInput" }
            example:
              footer_template: "© {tahun} PUTI (Pusat Teknologi Informasi) Al Bahjah"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Branding" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
  /v1/admin/settings/app-version:
    get:
      tags: [Sistem]
      summary: Pengaturan versi aplikasi Android
      description: Permission `settings:manage` (hanya super admin).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AppVersion" }
    put:
      tags: [Sistem]
      summary: Ubah versi aplikasi terbaru dan minimum
      description: >-
        Permission `settings:manage` (hanya super admin). `min_code` tidak boleh melebihi `latest_code`;
        menaikkan `min_code` membuat aplikasi lama dijawab 426 dan menampilkan layar wajib perbarui (berlaku dalam
        1 menit). `store_url` kosong memakai halaman Play Store. Dicatat sebagai `settings.changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppVersionInput" }
            example:
              latest_code: 14000
              latest_name: "0.14.0"
              min_code: 13000
              store_url: ""
              notes: "Aplikasi tetap bisa dibuka saat offline dan bisa dikunci dengan sidik jari."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AppVersion" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
  /v1/admin/settings/smtp:
    get:
      tags: [Sistem]
      summary: Pengaturan email (SMTP) saat ini
      description: Permission `settings:manage` (hanya super admin). Kata sandi SMTP tidak pernah dikirim; hanya `password_set`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SmtpSettings" }
    put:
      tags: [Sistem]
      summary: Simpan pengaturan email (SMTP) setelah uji kirim
      description: >-
        Permission `settings:manage`. Email uji dikirim lebih dulu ke email akun yang sedang login; pengaturan baru
        baru disimpan bila uji berhasil, dan pengaturan lama tetap dipakai bila gagal (`SMTP_TEST_FAILED`,
        `details.stage`: connect, tls, auth, atau send). Hanya port 465 (TLS) atau 587 (STARTTLS wajib), sertifikat
        diverifikasi, dan host yang mengarah ke alamat internal (loopback, link-local, privat) ditolak. Kata sandi
        disimpan terenkripsi dan tulis-saja; kosong berarti tetap memakai kata sandi lama. Dicatat
        `settings.changed` tanpa nilai rahasia.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmtpInput" }
      responses:
        "200":
          description: Tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SmtpSettings" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Sistem]
      summary: Matikan pengiriman email
      description: Permission `settings:manage`. Lupa kata sandi lewat email dan pemberitahuan keamanan berhenti dikirim.
      responses:
        "204": { description: Dimatikan }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/settings/storage:
    get:
      tags: [Sistem]
      summary: Status penyimpanan S3 dan migrasi
      description: Permission `settings:manage` (hanya super admin). Secret key tidak dikirim balik.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StorageSettings" }
    put:
      tags: [Sistem]
      summary: Uji koneksi lalu aktifkan SeaweedFS S3
      description: >-
        Permission `settings:manage`. Server menguji HeadBucket dan tulis/baca/hapus objek uji sebelum menyimpan.
        Secret key terenkripsi; kosong berarti mempertahankan yang lama. Setelah aktif, unggahan baru menuju S3,
        pembacaan berkas lama memiliki fallback disk. Endpoint dan bucket yang sudah aktif tidak dapat diganti.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageInput" }
      responses:
        "200":
          description: Aktif
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StorageSettings" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/admin/settings/storage/sync:
    post:
      tags: [Sistem]
      summary: Salin dan verifikasi batch berkas lama ke S3
      description: >-
        Permission `settings:manage`. Memproses hingga dua puluh berkas per panggilan; panggil berulang sampai migration.done
        bernilai true. Kursor tersimpan di database; salinan disk tidak dihapus. Objek S3 yang sudah ada dibandingkan,
        dan konflik isi menghentikan proses tanpa menimpa objek.
      responses:
        "200":
          description: Status migrasi
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StorageSettings" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/admin/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Kartu ringkasan
      description: "Permission `dashboard:read`."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DashboardSummary" }
  /v1/admin/dashboard/org-chart:
    get:
      tags: [Dashboard]
      summary: Data grafik struktur organisasi
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OrgChart" }

  /v1/leave-types:
    get:
      tags: [Pengajuan]
      summary: Jenis cuti aktif beserta saldo tahun ini
      description: >-
        Permission `leave:create`. `balance` hanya ada untuk jenis bersaldo (D47): `statutory` memberi 12 hari per
        tahun setelah 12 bulan bekerja dari `join_date`, `custom` memakai jatah dari SDM. Hari terpakai menghitung
        pengajuan pending dan approved pada tahun kalender berjalan.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LeaveType" }
  /v1/leaves:
    get:
      tags: [Pengajuan]
      summary: Pengajuan cuti/izin milik sendiri
      description: "Permission `leave:read`. Terbaru dulu, paling banyak 100, lengkap dengan timeline persetujuan."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LeaveRequest" }
    post:
      tags: [Pengajuan]
      summary: Ajukan cuti atau izin
      description: >-
        Permission `leave:create`. Hari dihitung server dari hari kerja shift tanpa hari libur. Ditolak bila
        bertabrakan dengan pengajuan pending/approved (`DUPLICATE_REQUEST`), menutupi hari yang sudah ada presensi
        masuk, melewati pergantian tahun, lebih dari 92 hari, mulai lebih dari 30 hari ke belakang, atau melebihi
        saldo. Alur persetujuan mengikuti `approval_flows` (default kadiv lalu sdm, D46).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaveInput" }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LeaveRequest" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/leaves/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Pengajuan]
      summary: Detail pengajuan sendiri dengan timeline
      description: "Permission `leave:read`. Pengajuan orang lain dijawab 404."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LeaveRequest" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/leaves/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Pengajuan]
      summary: Batalkan pengajuan yang masih menunggu
      description: "Permission `leave:create`. Langkah yang belum diputuskan menjadi `skipped`."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LeaveRequest" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/leaves:
    get:
      tags: [Pengajuan]
      summary: Pengajuan cuti/izin dalam scope
      description: "Permission `leave:read` dengan scope (subdiv, divisi, atau semua). Default tahun berjalan, paling banyak 500."
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/RequestStatus" } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LeaveRequest" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/leave-types:
    get:
      tags: [Pengajuan]
      summary: Semua jenis cuti, termasuk nonaktif
      description: "Permission `approval_flow:manage`."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LeaveType" }
    post:
      tags: [Pengajuan]
      summary: Tambah jenis cuti
      description: "Permission `approval_flow:manage`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaveTypeInput" }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LeaveType" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/leave-types/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Pengajuan]
      summary: Ubah jenis cuti
      description: "Permission `approval_flow:manage`. Kode tidak bisa diubah; kirim semua field selain `code`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaveTypeInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LeaveType" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/approvals/pending:
    get:
      tags: [Pengajuan]
      summary: Langkah persetujuan yang menunggu keputusan saya
      description: >-
        Permission `approval:act`. Berisi langkah yang ditugaskan kepada pemanggil, ditambah pool `sdm` bila
        pemanggil berrole sdm. Pengajuan milik sendiri tidak pernah tampil.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ApprovalItem" }
  /v1/approvals/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Pengajuan]
      summary: Detail langkah persetujuan dengan timeline pengajuan
      description: "Permission `approval:act`. Hanya untuk approver langkah itu; selain itu 404."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ApprovalItem" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/approvals/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Pengajuan]
      summary: Setujui langkah
      description: >-
        Permission `approval:act`. Ditolak bila pemanggil pemohon (`APPROVAL_SELF_FORBIDDEN`), bukan approver atau
        langkah sebelumnya belum diputuskan (`APPROVAL_NOT_YOUR_TURN`), atau sudah diputuskan (`REQUEST_NOT_PENDING`).
        Langkah terakhir yang disetujui menyelesaikan pengajuan; untuk cuti, hari kerjanya tercatat `leave` di presensi.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ApprovalItem" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/approvals/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Pengajuan]
      summary: Tolak langkah
      description: "Permission `approval:act`. `note` wajib, minimal 3 karakter. Langkah tersisa menjadi `skipped`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ApprovalItem" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/approval-flows/{request_type}:
    parameters:
      - { name: request_type, in: path, required: true, schema: { $ref: "#/components/schemas/RequestKind" } }
    get:
      tags: [Pengajuan]
      summary: Alur persetujuan satu jenis pengajuan
      description: "Permission `approval_flow:manage`."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ApprovalFlow" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Pengajuan]
      summary: Ganti alur persetujuan
      description: >-
        Permission `approval_flow:manage`. 1 sampai 5 langkah, approver `subdiv`, `kadiv`, atau `sdm`, masing-masing
        sekali. Berlaku untuk pengajuan baru; pengajuan berjalan memakai snapshot langkahnya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalFlowInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ApprovalFlow" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/reports/attendance:
    get:
      tags: [Laporan]
      summary: Rekap presensi bulanan
      description: "Permission `attendance:report`, dibatasi scope. Filter mode hanya menghitung catatan presensi masuk dengan mode tersebut; cuti dan alpha tidak disertakan. Rekap per periode cutoff ubar dan aturan upah (D29/D31) menyusul di Fase 5."
      parameters:
        - $ref: "#/components/parameters/Year"
        - $ref: "#/components/parameters/Month"
        - { name: division_id, in: query, schema: { type: string, format: uuid } }
        - { name: work_mode, in: query, schema: { type: string, enum: [onsite, wfa, field] }, description: Hanya hitung presensi dengan mode ini }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AttendanceReportRow" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
  /v1/admin/reports/attendance/export:
    get:
      tags: [Laporan]
      summary: Ekspor rekap presensi format Excel SDM (.xlsx)
      description: >-
        Permission `attendance:report`, dibatasi scope. Menghasilkan berkas Excel `.xlsx` dengan 2 worksheet
        (`Presensi Wajah` untuk jam Masuk/Pulang harian dan `Rekap Kehadiran` untuk kode status H/S/I/A/L/C/IS/T/WFH serta rumus
        COUNTIF, Jumlah HK, dan Persentase) untuk periode cutoff tanggal 26 bulan sebelumnya s.d. tanggal 25 bulan yang dipilih.
      parameters:
        - $ref: "#/components/parameters/Year"
        - $ref: "#/components/parameters/Month"
        - { name: division_id, in: query, schema: { type: string, format: uuid } }
        - { name: work_mode, in: query, schema: { type: string, enum: [onsite, wfa, field] }, description: Hanya hitung presensi dengan mode ini }
      responses:
        "200":
          description: Berkas Excel (.xlsx)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400": { $ref: "#/components/responses/ValidationFailed" }
  /v1/admin/reports/payroll-preview:
    get:
      tags: [Laporan]
      summary: Pratinjau ubar berdasarkan presensi
      description: "Permission `attendance:report` dan `payroll:manage`. Rumus sementara, ada di `meta.rules`."
      parameters:
        - $ref: "#/components/parameters/Year"
        - $ref: "#/components/parameters/Month"
        - { name: division_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PayrollPreviewRow" }
                  meta:
                    type: object
                    required: [rules]
                    properties:
                      rules: { $ref: "#/components/schemas/PayrollRules" }
        "400": { $ref: "#/components/responses/ValidationFailed" }

components:
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Nilai cookie `hris_csrf`. Wajib untuk semua method selain GET, HEAD, dan OPTIONS.
    cookieAuth:
      type: apiKey
      in: cookie
      name: hris_at
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token aplikasi mobile, terikat perangkat lewat klaim `did`. Tidak butuh CSRF. Bila header `Authorization` dikirim, cookie diabaikan.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Year:
      name: year
      in: query
      required: true
      schema: { type: integer, minimum: 2000, maximum: 2100 }
    Month:
      name: month
      in: query
      required: true
      schema: { type: integer, minimum: 1, maximum: 12 }
  responses:
    Error:
      description: Error dengan kode dari registry MASTER.md §7.4
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationFailed:
      description: Input tidak valid, rincian per field ada di `details.fields`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: VALIDATION_FAILED
              message: Periksa kembali isian form.
              details: { fields: { full_name: Nama lengkap wajib diisi. } }
              request_id: 01J0000000000000000000000
  schemas:
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: Rupiah, string desimal 2 digit
      example: "5000000.00"
    Role:
      type: string
      enum: [pejuang, subdiv, kadiv, sdm, superadmin]
    ErrorCode:
      type: string
      description: Registry MASTER.md §7.4
      enum:
        - VALIDATION_FAILED
        - AUTH_INVALID_CREDENTIALS
        - AUTH_TOKEN_INVALID
        - AUTH_MFA_REQUIRED
        - AUTH_MFA_INVALID
        - FORBIDDEN_ROLE
        - CSRF_INVALID
        - PASSWORD_CHANGE_REQUIRED
        - MFA_SETUP_REQUIRED
        - DEVICE_NOT_REGISTERED
        - DEVICE_PENDING_APPROVAL
        - DEVICE_REVOKED
        - APPROVAL_NOT_YOUR_TURN
        - APPROVAL_SELF_FORBIDDEN
        - MAKER_CHECKER_VIOLATION
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - ALREADY_CLOCKED_IN
        - ALREADY_CLOCKED_OUT
        - SHIFT_NOT_ASSIGNED
        - NOT_CLOCKED_IN
        - REQUEST_NOT_PENDING
        - PERIOD_LOCKED
        - DUPLICATE_REQUEST
        - CONFLICT_DUPLICATE
        - CONFLICT_HAS_DEPENDENTS
        - CONFLICT_SELF_ACTION
        - MFA_ALREADY_ENABLED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - GEOFENCE_OUT
        - FACE_NOT_ENROLLED
        - FACE_MISMATCH
        - LIVENESS_FAILED
        - FACE_NOT_DETECTED
        - FACE_SERVICE_UNAVAILABLE
        - STORAGE_UNAVAILABLE
        - STORAGE_DESTINATION_LOCKED
        - STORAGE_TEST_FAILED
        - STORAGE_NOT_ACTIVE
        - STORAGE_SOURCE_MISSING
        - STORAGE_SYNC_BUSY
        - STORAGE_SYNC_FAILED
        - FILE_UNSAFE
        - FILE_SCAN_UNAVAILABLE
        - SMTP_TEST_FAILED
        - RESET_TOKEN_INVALID
        - EMAIL_CHANGE_INVALID
        - ACCOUNT_CHANGE_NOT_ALLOWED
        - CHALLENGE_EXPIRED
        - ATTENDANCE_BLOCKED
        - LEAVE_ACTIVE
        - READ_TOO_SOON
        - AUTH_ACCOUNT_LOCKED
        - AUTH_INITIAL_PASSWORD_EXPIRED
        - APP_UPDATE_REQUIRED
        - RATE_LIMITED
        - API_ACCESS_DENIED
        - INTERNAL_ERROR
    Permission:
      type: string
      description: Matriks MASTER.md §3.2
      enum:
        - "profile:read"
        - "profile:update"
        - "org:read"
        - "org:write"
        - "employee:read"
        - "employee:write"
        - "user:manage"
        - user:reset
        - "device:register"
        - "device:review"
        - "face:enroll"
        - "face:reset"
        - "attendance:clock"
        - "attendance:read"
        - "attendance:review"
        - "attendance:report"
        - "location:manage"
        - "shift:manage"
        - "leave:create"
        - "cash_advance:create"
        - "transfer:create"
        - "leave:read"
        - "cash_advance:read"
        - "transfer:read"
        - "approval:act"
        - "payslip:read"
        - "payroll:manage"
        - "payroll:finalize"
        - "warning:read"
        - "warning:manage"
        - "announcement:read"
        - "announcement:manage"
