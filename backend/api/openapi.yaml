      responses:
        "204": { description: Izin disimpan }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Wajah]
      summary: Cabut izin daftar wajah jarak jauh
      responses:
        "204": { description: Izin dicabut }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/employees/{id}/face/reset:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Wajah]
      summary: Reset wajah Pejuang
      description: "Permission `face:reset` (SDM). Pejuang harus mendaftar ulang. Tidak untuk diri sendiri (`CONFLICT_SELF_ACTION`) dan tidak untuk super admin (D34). 404 bila wajahnya belum terdaftar."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "204": { description: Wajah direset }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/devices/register:
    post:
